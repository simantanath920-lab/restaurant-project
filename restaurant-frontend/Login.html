<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        body{
             font-family: "Montserrat", sans-serif;  
        } 

        /* Main-Section-Parent */
          .Main-Section-Parent{
            position: relative;
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .MainLogo-Image{
            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position:right center;
            position: absolute;
            top: 0;
            left: 0;

            z-index: -1;
        }
        .Main-Section-Parent{
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }


 



        /* Login Cart */
        .card{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            text-align: center;
            width: min(90%,500px);
            background-color: rgba(250, 235, 215, 0.666);
        }

        .Input-One{
            background: antiquewhite;
            transition: all 1.35s ease-in-out;
            padding: 14px 40px;
            border: 1px solid antiquewhite;
        }
        .Input-One:hover{
            background-color: rgb(149, 171, 118);
            letter-spacing: 2px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }
        .bttnn{
            border: 1px solid rgb(0, 0, 0);
            background-color: black;
            border-radius: 40px;
            padding: 10px;
            color: rgb(149, 171, 118);
            font-weight: 400;
        }
        
        .bttnn:hover{
            border: 1px solid rgb(0, 0, 0);
            color: rgb(0, 0, 0);
            transition: all 0.25s ease-in-out; 
            background-color: rgb(149, 171, 118);
        }
        .form-control:focus{
            background-color: rgb(227, 144, 144);
        }

        .forgot-Password-btn{
             color: rgb(7, 48, 15);
        } 
        .forgot-Password-btn:hover{
             color: rgb(7, 48, 15);
        }

        .register-btn{
            color: rgb(7, 48, 15);
        }
        .register-btn:hover{
            color: rgb(7, 48, 15);
        }
        


        /* POP-UP */
        .custom-modal{
            background-color: antiquewhite;
            border-radius: 20px;
            overflow: hidden;
        }

        .custom-modal .modal-header{
            background-color: black;
            color: rgb(149,171,118);
        }

        .success-icon{
            font-size: 4rem;
            color: rgb(149,171,118);
        }

        #modalMessage{
            font-size: 1rem;
            font-weight: 500;
            color: #333;
        }

        .custom-modal-btn{
            background-color: black;
            color: rgb(149,171,118);

            border: none;
            border-radius: 30px;

            padding: 10px 25px;

            transition: all .3s ease;
        }

        .custom-modal-btn:hover{
            background-color: rgb(149,171,118);
            color: black;
        }


        /* Footer Section */
        .footer-Section-last{
            background-color: #272d21;
            color: #62794e;
            font-weight: 200;
        }

        .icons a{
            display: inline-flex;
            border: 1px solid #62794e;
            width: 50px;
            height: 50px;
            border-radius: 50px;
            align-items: center;
            justify-content: center;
        }

        .icons i{
            font-size: 22px;
            color: #62794e;
        }


    </style>

</head>
<body>
    <section class="Main-Section-Parent">
        <img src="67F18543-FEF8-4CA4-AFC2-BAAF29CBDE53.PNG" alt="mainlogo" class="MainLogo-Image shadow-lg">

           <div class="card shadow-lg border-0">
                <div class="card-body">
                    <h3 class="ms-auto card-title">L O G I N</h3>
                    
                    <form id="loginForm" novalidate>

                        <div class="mt-3 mb-3">
                            <label for="email" class="form-label text-start d-block">E m a i l</label>
                            <input type="email" class="form-control shadow-lg  Input-One text-center" name="email" id="email" placeholder="Y o u r   e m a i l">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mt-3 mb-3">
                            <label for="password" class="form-label text-start d-block">P a s s w o r d</label>
                            <input type="password" class="form-control shadow-lg  Input-One text-center" name="password" id="password" placeholder="Y o u r   p a s s w o r d">
                            <div class="invalid-feedback"></div>
                        </div>
 
                        <div class="text-end">
                            <a href="Forgot_Password.html" class="forgot-Password-btn">Forgot Password?</a>
                        </div> 

                        <button class="bttnn w-50 mt-4 mb-3" type="submit" id="submitBtn">
                            <span id="textBtn">Login</span>
                        </button>
                    </form>

                    <div class="Register-Part">
                        <p>Don't have an account?
                            <span>
                                <a href="Register.html" class="register-btn">Register</a>
                            </span>    
                        </p>
                    </div> 

                    <div class="back-btn-part">
                        <a href="PUBLIC_HomePage.html" class="register-btn">back</a>
                    </div>
                </div>
          </div>
    </section>


    <!-- Footer Section -->
    <section class="footer-Section-last text-center py-5">
            <div class="container">
                <div class="d-flex flex-column flex-lg-row justify-content-center align-items-center gap-5 gap-lg-5">

                    <!-- Address -->
                    <div>
                        <h6>Address</h6>
                        <p class="mb-1">Madurdaha Kolkata</p>
                        <p class="mb-0">West bengal 700107</p>
                    </div>

                    <!-- Contact -->
                    <div>
                        <h6>Contact</h6>
                        <p class="mb-1">Phone: +91 863-8148837</p>
                        <p class="mb-0">Email: nh15restaurantonline@gmail.com</p>
                    </div>

                    <!-- Opening Hours -->
                    <div>
                        <h6>Opening Hours</h6>
                        <p class="mb-1">Mon-Sat: 11AM - 10PM</p>
                        <p class="mb-0">Sunday: Closed</p>
                    </div>

                    <div class="icons">
                        <h6>Follow Us</h6>
                        <a href="#" class="text-dark me-3"><i class="bi bi-instagram"></i></a>
                        <a href="#" class="text-dark me-3"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="text-dark me-3"><i class="bi bi-linkedin"></i></a>
                        <a href="#" class="text-dark me-3"><i class="bi bi-twitter-x"></i></a>
                    </div>

                </div>
                
                <hr>
                <h6 class="fw-light mb-0">&copy; NH15 Restaurant</h6>
            </div>
        </section>
 


    <!-- POP UP -->
    <div class="modal fade" id="messageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content custom-modal">

                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">NH15 Restaurant</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body text-center">
                    <i id="modalIcon" class="bi bi-check-circle-fill success-icon"></i>
                    <p id="modalMessage" class="mt-3 mb-3"></p>
                    <button id="resendVerificationBtn" type="button" class="custom-modal-btn" style="display: none;">Send Verification Link</button>
                </div>

                <div class="modal-footer border-0 justify-content-center">
                    <button type="button" class="custom-modal-btn" data-bs-dismiss="modal">Continue</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Pop Up
        function showPopup(message, showResendButton = false){

            const modalMessage = document.getElementById("modalMessage");
            modalMessage.innerText = message;

            resendVerificationBtn.style.display = showResendButton ? "inline-block" : "none";

            const messageModal = document.getElementById("messageModal");
            const modal = new bootstrap.Modal(messageModal);
            modal.show();
        }



        const LoginForm = document.getElementById("loginForm");

        const email = document.getElementById("email");
        const password = document.getElementById("password");

        const submitBtn = document.getElementById("submitBtn");
        const textBtn = document.getElementById("textBtn");

        // 1st Function
        function showError(input,message){
            input.classList.add("is-invalid");
            input.classList.remove("is-valid");
            
            input.nextElementSibling.innerText = message;
            input.nextElementSibling.classList.add("d-block");
        }

        // 2nd Function
        function showSuccess(input){
            input.classList.add("is-valid");
            input.classList.remove("is-invalid");

            input.nextElementSibling.innerText = "";
            input.nextElementSibling.classList.remove("d-block");
        }

        // 3rd Function
        function validateInput(){

            let isvalid = true;

            // Email validate
            if(email.value.trim() === ""){
                showError(email,"Email address is required.");
                isvalid = false;
            }else{
                showSuccess(email);
            }

            // Password validate
            if(password.value.trim() === ""){
                showError(password,"Password is required.");
                isvalid = false;
            }else{
                showSuccess(password);
            }

            return isvalid;
        }

        // 1st Event
        LoginForm.addEventListener("input",function(){
            validateInput();
        });

        // 2nd Event
        LoginForm.addEventListener("submit", async function(e){

            e.preventDefault();

            if(!validateInput()){
                return;
            }

            const user = {
                email: email.value.trim().toLowerCase(),
                password: password.value.trim()
            };

            try{

                submitBtn.disabled = true;
                textBtn.innerText = "Login...";

                const response = await fetch("http://localhost:8080/restaurant/api/auth/login",{
                        method: "POST",

                        headers:{
                            "Content-Type":"application/json"
                        },

                        body: JSON.stringify(user)
                    }
                );

                const data = await response.json();

                if(response.ok){
 
                        if(data.jwtToken){
                            localStorage.setItem("token", data.jwtToken);
                        }

                        if(data.role){
                            localStorage.setItem("role", data.role);
                        }
                        if(data.userId){
                            localStorage.setItem("userId",data.userId);
                        }



                        const rolePages = {
                            ADMIN: "ADMIN_HomePage.html",
                            USER: "USER_HomePage.html"
                        };

                        const redirectPage = rolePages[data.role];

                        if(redirectPage){

                            showPopup(data.message);

                            setTimeout(() => {
                                window.location.replace(redirectPage);
                            },1500);

                            LoginForm.reset();

                            [email,password].forEach(input => {

                                input.classList.remove("is-invalid","is-valid");

                                input.nextElementSibling.innerText = "";
                            });

                        }
                        else{

                            console.error("Unknown role:", data.role);

                            localStorage.removeItem("token");
                            localStorage.removeItem("role");
                            localStorage.removeItem("userId");

                            showPopup("Login Failed. Please contact support.");
                            return;
                        }
                    }

                else{

                    if(data.email){
                        showError(email,data.email);
                    }

                    if(data.password){
                        showError(password,data.password);
                    }

                    if(data.message){

                        if(data.message === "Please verify your email."){
                            localStorage.setItem("verificationEmail",email.value.trim().toLowerCase());
                            showPopup("Please verify your email before logging in.",true);
                        }else{
                            showPopup(data.message);
                        }
                    }
                }
            }
            catch(error){
                console.error("Login Error:",error);
                showPopup("Network error! Please try again later.");
            }

            finally{
                submitBtn.disabled = false;
                textBtn.innerText = "Login";
            }
        });


        const resendVerificationBtn = document.getElementById("resendVerificationBtn");

        resendVerificationBtn.addEventListener("click", async function(e){

            e.preventDefault();

            const email = localStorage.getItem("verificationEmail");

            if(!email){
                showPopup("Verification email not found. Please login again.");
                return;
            }

            try{

                resendVerificationBtn.disabled = true;
                resendVerificationBtn.innerText = "Sending...";

                const response = await fetch(`http://localhost:8080/restaurant/api/auth/resend-verification-Link?email=${encodeURIComponent(email)}`,
                    {
                        method: "POST"
                    }
                );

                const data = await response.json();

                if(response.ok){

                    document.getElementById("modalMessage").innerText = data.message;
                    resendVerificationBtn.style.display = "none";

                }else{

                    document.getElementById("modalMessage").innerText = data.message || "Unable to resend verification link.";
                 }
                
            }catch(error){

                console.error("Resend Verification Error:", error);
                showPopup("Server error! Please try again later.");

            }
            
            finally{
                resendVerificationBtn.disabled = false;
                resendVerificationBtn.innerText = "Resend Verification Link";
            }
        });

        </script>
</body>
</html>
