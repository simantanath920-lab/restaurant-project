<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Summary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>

        body {
            background-color: #f9ead9;
            color: #272d21;
            font-weight: 300;
            font-family: "Montserrat", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #notificationModal {
            z-index: 2000;
        }

        .notification-icon {
            font-size: 55px;
        }

        .notification-success {
            color: rgb(149,171,118);
        }

        .notification-error {
            color: rgb(220,116,116);
        }

        .custom-modal {
            background-color: antiquewhite;
            border-radius: 30px;
            overflow: hidden;
        }

        .custom-header {
            background-color: black;
            color: rgb(149,171,118);
        }

        .checkout-page-title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 3px;
            color: #272d21;
        }

        #checkoutSummery {
            margin-top: 35px;
        }

        .receipt-card {
            background-color: #fffaf3;
            border: 1px solid rgba(39,45,33,0.25);
            border-radius: 0;
            position: relative;
            box-shadow: 0 8px 20px rgba(39,45,33,0.15);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .receipt-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(39,45,33,0.20);
        }

        /* Receipt top */

        .receipt-header {
            background-color: #272d21;
            color: #f9ead9;
            padding: 18px 20px;
            text-align: center;
        }

        .receipt-header h3 {
            margin: 0;
            font-size: 17px;
            font-weight: 300;
            letter-spacing: 3px;
        }

        .receipt-header p {
            margin: 5px 0 0;
            font-size: 10px;
            letter-spacing: 1px;
            color: #62794e;
        }

        /* Receipt body */

        .receipt-body {
            padding: 25px;
        }

        .receipt-body p {
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.5px;
            color: #272d21;
        }

        .receipt-body strong {
            font-weight: 400;
            color: #62794e;
        }

        /* Dashed receipt line */

        .receipt-line {
            border-top: 1px dashed rgba(39,45,33,0.45);
            margin: 15px 0;
        }

        /* FOOD IMAGE */

        .receipt-food-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            margin-bottom: 20px;
        }

        /* PRICE / SUBTOTAL */

        .receipt-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed rgba(39,45,33,0.35);
        }

        .receipt-price span {
            font-size: 12px;
            font-weight: 300;
        }

        .receipt-price strong {
            font-size: 15px;
            font-weight: 400;
            color: #272d21;
        }

        /* ADDRESS RECEIPT */

        .address-receipt {
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .address-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 6px 0;
            border-bottom: 1px dotted rgba(39,45,33,0.25);
        }

        .address-row:last-child {
            border-bottom: none;
        }

        .address-row span:first-child {
            color: #62794e;
            font-size: 11px;
            font-weight: 300;
        }

        .address-row span:last-child {
            text-align: right;
            font-size: 12px;
            font-weight: 300;
        }

        /* TOTAL BILL */

        .bill-card {
            max-width: 500px;
            margin: 45px auto 0;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 12px;
            font-weight: 300;
        }

        .bill-row.grand-total {
            margin-top: 10px;
            padding-top: 15px;
            border-top: 2px solid #272d21;
            font-size: 16px;
            font-weight: 400;
        }

        .bill-row.grand-total span:last-child {
            color: #62794e;
            font-weight: 400;
        }

        .free-delivery {
            color: #62794e;
        }

        /* PAYMENT CARD */

        #checkoutCard {
            max-width: 500px;
            margin: 35px auto 60px;
            background-color: #fffaf3;
            border: 1px solid rgba(39,45,33,0.25) !important;
            border-radius: 0 !important;
            box-shadow: 0 8px 20px rgba(39,45,33,0.15) !important;
        }

        #checkoutCard h5 {
            color: #272d21;
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .payment-button {
            background-color: #272d21;
            color: #f9ead9;
            border: 1px solid #62794e;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 1px;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .payment-button:hover {
            background-color: #62794e;
            color: white;
        }

        /* =========================
           EMPTY CART
        ========================= */

        .empty-cart-card {
            background-color: rgba(249,234,217,0.92);
            border: 1px solid rgba(39,45,33,0.25);
            border-radius: 12px;
            padding: 45px 20px;
            margin-top: 40px;
        }

        .empty-cart-card h4 {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .continue-shopping {
            background-color: #272d21;
            color: #f9ead9;
            border: 1px solid #62794e;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 1px;
            padding: 9px 20px;
            transition: all 0.3s ease;
        }

        .continue-shopping:hover {
            background-color: #62794e;
            color: white;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer-Section-last {
            background-color: #272d21;
            color: #62794e;
            font-weight: 200;
            margin-top: auto;
        }

        .icons a {
            display: inline-flex;
            border: 1px solid #62794e;
            width: 50px;
            height: 50px;
            border-radius: 50px;
            align-items: center;
            justify-content: center;
        }

        .icons i {
            font-size: 22px;
            color: #62794e;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 767px) {

            .checkout-page-title {
                font-size: 25px;
                letter-spacing: 2px;
            }

            .receipt-body {
                padding: 20px;
            }

            .receipt-food-image {
                height: 170px;
            }

            .address-row {
                flex-direction: column;
                gap: 2px;
            }

            .address-row span:last-child {
                text-align: left;
            }

        }

    </style>
</head>


<body>

    <!-- =========================
         NOTIFICATION POPUP
    ========================= -->

    <div class="modal fade" id="notificationModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center custom-modal">

                <div class="modal-header border-0 custom-header">
                    <h5 class="mb-0">NH15 Restaurant</h5>
                    <button class="btn btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div id="notificationIconContainer" class="notification-icon">
                        <i id="notificationIconElement"></i>
                    </div>

                    <h3 id="notificationTitle"></h3>
                    <p id="notificationMessage"></p>

                    <button class="btn btn-dark" style="border-radius:20px; width:150px; color:rgb(149,171,118);" type="button" data-bs-dismiss="modal">ok</button>

                </div>

            </div>
        </div>
    </div>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="container py-5">

        <h2 class="text-center checkout-page-title" style="letter-spacing: 0.7rem;">
            CHECKOUT SUMMARY
        </h2>

        <div class="row justify-content-center" id="checkoutSummery"></div>


        <!-- =========================
             PAYMENT
        ========================= -->

        <div id="checkoutCard" class="card d-none">

            <div class="card-body text-center">

                <h5 class="mb-4">
                    Choose payment method
                </h5>

                <button onclick="window.location.href='USER_Choose_Payment_Method.html'" class="btn payment-button w-100">Proceed to Pay</button>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <section class="footer-Section-last text-center py-5">

        <div class="container">

            <div class="d-flex flex-column flex-lg-row justify-content-center align-items-center gap-5">

                <!-- Address -->

                <div>
                    <h6>Address</h6>
                    <p class="mb-1">Madurdaha Kolkata</p>
                    <p class="mb-0">West Bengal 700107</p>
                </div>


                <!-- Contact -->

                <div>
                    <h6>Contact</h6>
                    <p class="mb-1">Phone: +91 863-8148837</p>
                    <p class="mb-0">Email: nh15restaurantonline@gmail.com</p>
                </div>


                <!-- Opening Hours -->

                <div>
                    <h6>Opening Hours</h6>
                    <p class="mb-1">Mon-Sat: 11AM - 10PM</p>
                    <p class="mb-0">Sunday: Closed</p>
                </div>


                <!-- Social -->

                <div class="icons">

                    <h6>Follow Us</h6>

                    <a href="#" class="text-dark me-3">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="#" class="text-dark me-3">
                        <i class="bi bi-facebook"></i>
                    </a>

                    <a href="#" class="text-dark me-3">
                        <i class="bi bi-linkedin"></i>
                    </a>

                    <a href="#" class="text-dark me-3">
                        <i class="bi bi-twitter-x"></i>
                    </a>

                </div>

            </div>

            <hr>

            <h6 class="fw-light mb-0">
                &copy; NH15 Restaurant
            </h6>

        </div>

    </section>


    <script>

        // =====================
        // [    Access Check   ]
        // =====================

        function checkUserAccess() {

            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");

            if (!token || role !== "USER") {

                showNotification(
                    "error",
                    "Access denied!",
                    "Please login to access this page."
                );

                setTimeout(() => {
                    window.location.href = "Login.html";
                },2000);

                return false;
            }

            return true;
        }


        // =====================
        // [ Notification ]
        // =====================

        const notificationModal = document.getElementById("notificationModal");

        function showNotification(type,title,message) {

            const notificationIconContainer = document.getElementById("notificationIconContainer");
            const notificationIconElement = document.getElementById("notificationIconElement");
            const notificationTitle = document.getElementById("notificationTitle");
            const notificationMessage = document.getElementById("notificationMessage");

            notificationIconContainer.classList = "notification-icon";

            if(type === "success") {

                notificationIconContainer.classList.add(
                    "notification-success"
                );

                notificationIconElement.className =
                    "bi bi-check-circle-fill";

            }

            else if(type === "error") {

                notificationIconContainer.classList.add(
                    "notification-error"
                );

                notificationIconElement.className =
                    "bi bi-x-circle-fill";

            }

            notificationTitle.textContent = title;
            notificationMessage.textContent = message;

            const modal = new bootstrap.Modal(notificationModal);
            modal.show();

        }


        // =====================
        // [ Variables ]
        // =====================

        const userId = localStorage.getItem("userId");
        const checkoutSummery = document.getElementById("checkoutSummery");
        const checkoutCard = document.getElementById("checkoutCard");


        // =====================
        // [ Checkout Summary ]
        // =====================

        async function View_Checkout_Summery() {

            const token = localStorage.getItem("token");

            try {

                const response = await fetch(
                    `http://localhost:8080/restaurant/user/api/checkout-summary/view/${userId}`,
                    {
                        method : "GET",

                        headers : {
                            "Authorization":"Bearer " + token
                        }
                    }
                );


                // =====================
                // [ 401 ]
                // =====================

                if(response.status === 401) {

                    localStorage.removeItem("token");

                    showNotification(
                        "error",
                        "Session expired!",
                        "Please login again."
                    );

                    setTimeout(() => {
                        window.location.href = "Login.html";
                    },2000);

                    return;
                }


                // =====================
                // [ 403 ]
                // =====================

                if(response.status === 403) {

                    showNotification(
                        "error",
                        "Access denied!",
                        "You do not have permission to access this resource"
                    );

                    return;
                }


                const data = await response.json();


                // =====================
                // [ EMPTY CART ]
                // =====================

                if(!data.items || data.items.length === 0) {

                    checkoutSummery.innerHTML = `

                        <div class="col-12">

                            <div class="empty-cart-card text-center">

                                <h4>YOUR CART IS EMPTY</h4>

                                <p class="mt-3 mb-4">
                                    Please add items to your cart before checkout.
                                </p>

                                <a href="USER_HomePage.html" class="btn continue-shopping">Continue Shopping</a>

                            </div>

                        </div>

                    `;

                    checkoutCard.classList.add("d-none");

                    return;
                }


                // =====================
                // [ SUCCESS ]
                // =====================

                if(response.ok) {

                    checkoutCard.classList.remove("d-none");
                    checkoutSummery.innerHTML = "";


                    // =====================
                    // [ FOOD ITEMS ]
                    // =====================

                    data.items.forEach(item => {

                        checkoutSummery.innerHTML += `

                            <div class="col-12 col-md-6 col-lg-4 mb-4">

                                <div class="receipt-card h-100">

                                    <div class="receipt-header">

                                        <h3>
                                            NH15 RESTAURANT
                                        </h3>

                                        <p>
                                            ORDER ITEM
                                        </p>

                                    </div>


                                    <div class="receipt-body">

                                        <p>
                                            <strong>Item</strong>
                                            ${item.menuName}
                                        </p>

                                        <p>
                                            <strong>Item ID</strong>
                                            ${item.menuId}
                                        </p>

                                        <div class="receipt-line"></div>

                                        <p>
                                            <strong>Price</strong>
                                            ₹${item.price}
                                        </p>

                                        <p>
                                            <strong>Quantity</strong>
                                            ${item.quantity}
                                        </p>

                                        <div class="receipt-price">

                                            <span>
                                                Subtotal
                                            </span>

                                            <strong>
                                                ₹${item.subtotal}
                                            </strong>

                                        </div>

                                    </div>

                                </div>

                            </div>

                        `;

                    });


                    // =====================
                    // [ ADDRESS ]
                    // =====================

                    checkoutSummery.innerHTML += `

                        <div class="col-12">

                            <div class="receipt-card address-receipt">

                                <div class="receipt-header">

                                    <h3>
                                        DELIVERY ADDRESS
                                    </h3>

                                    <p>
                                        DEFAULT ADDRESS
                                    </p>

                                </div>


                                <div class="receipt-body">

                                    <div class="address-row">

                                        <span>ID</span>

                                        <span>
                                            ${data.address.id}
                                        </span>

                                    </div>

                                    <div class="address-row">

                                        <span>Name</span>

                                        <span>
                                            ${data.address.fullName}
                                        </span>

                                    </div>

                                    <div class="address-row">

                                        <span>Phone</span>

                                        <span>
                                            ${data.address.phoneNumber}
                                        </span>

                                    </div>

                                    <div class="address-row">

                                        <span>Street</span>

                                        <span>
                                            ${data.address.street}
                                        </span>

                                    </div>

                                    <div class="address-row">

                                        <span>Area</span>

                                        <span>
                                            ${data.address.area}
                                        </span>

                                    </div>

                                    <div class="address-row">

                                        <span>City</span>

                                        <span>
                                            ${data.address.city}
                                        </span>

                                    </div>

                                    <div class="address-row">

                                        <span>State</span>

                                        <span>
                                            ${data.address.state}
                                        </span>

                                    </div>

                                    <div class="address-row">

                                        <span>Pincode</span>

                                        <span>
                                            ${data.address.pincode}
                                        </span>

                                    </div>

                                    <div class="address-row">

                                        <span>Country</span>

                                        <span>
                                            ${data.address.country}
                                        </span>

                                    </div>

                                    <div class="address-row">

                                        <span>Type</span>

                                        <span>
                                            ${data.address.addressType}
                                        </span>

                                    </div>

                                </div>

                            </div>

                        </div>

                    `;


                    // =====================
                    // [ BILL TOTAL ]
                    // =====================

                    checkoutSummery.innerHTML += `

                        <div class="col-12">

                            <div class="receipt-card bill-card">

                                <div class="receipt-header">

                                    <h3>
                                        BILL SUMMARY
                                    </h3>

                                    <p>
                                        NH15 RESTAURANT
                                    </p>

                                </div>


                                <div class="receipt-body">

                                    <div class="bill-row">

                                        <span>
                                            Cart Total
                                        </span>

                                        <span>
                                            ₹${data.cartTotal}
                                        </span>

                                    </div>

                                    <div class="bill-row">

                                        <span>
                                            Delivery Charge
                                        </span>

                                        <span>
                                            ${data.freeDelivery
                                                ? "FREE"
                                                : "₹" + data.deliveryCharge}
                                        </span>

                                    </div>

                                    <div class="bill-row">

                                        <span>
                                            Free Delivery
                                        </span>

                                        <span class="free-delivery">
                                            ${data.freeDelivery}
                                        </span>

                                    </div>

                                    <div class="bill-row grand-total">

                                        <span>
                                            GRAND TOTAL
                                        </span>

                                        <span>
                                            ₹${data.grandTotal}
                                        </span>

                                    </div>

                                </div>

                            </div>

                        </div>

                    `;

                }

                else {

                    showNotification(
                        "error",
                        "Error!",
                        "Unable to fetch checkout summary."
                    );

                }

            }

            catch(error) {

                console.log(error);

                showNotification(
                    "error",
                    "Server Error!",
                    "Please try again later."
                );

            }

        }


        // =====================
        // [ DOM CONTENT LOADED ]
        // =====================

        document.addEventListener("DOMContentLoaded", function() {

            if(!checkUserAccess()) {
                return;
            }

            View_Checkout_Summery();

        });

    </script>

</body>
</html>
