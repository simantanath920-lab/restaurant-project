<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        /* =========================
           BODY
        ========================= */
        body {
            background-color: #f9ead9;
            color: #272d21;
            font-weight: 300;
            font-family: "Montserrat", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* =========================
           NOTIFICATION POPUP
           YOUR ORIGINAL - UNTOUCHED
        ========================= */
        #notificationModal{
            z-index: 2000;
        }
        .notification-icon{
            font-size: 55px;
        }
        .notification-success{
            color: rgb(149,171,118);
        }
        .notification-error{
            color: rgb(220, 116, 116);
        }
        .custom-modal{
            background-color: antiquewhite;
            border-radius: 30px;
            overflow: hidden;
        }
        .custom-header{ 
            background-color: black;
            color: rgb(149,171,118);
        }


        /* =========================
           MAIN
        ========================= */
        .category-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 70px 20px;
        }
        .category-main > div {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =========================
           PAGE TITLE
        ========================= */
        .category-page-title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 3px;
            color: #272d21;
            margin-bottom: 35px;
            text-align: center;
        }


        /* =========================
           CATEGORY CONTAINER
        ========================= */
        .category-section {
            width: min(94%, 700px);
            background-color: #fffaf3;
            border: 1px solid rgba(39,45,33,0.25);
            box-shadow:0 8px 20px rgba(39,45,33,0.15);
            overflow: hidden;
        }


        /* =========================
           CATEGORY HEADER
        ========================= */
        .category-section-header {
            background-color: #272d21;
            color: #f9ead9;
            padding: 20px;
            text-align: center;
        }

        .category-section-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 3px;
        }

        .category-section-header p {
            margin: 6px 0 0;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #62794e;
        }


        /* =========================
           FORM
        ========================= */
        .category-form {
            padding: 30px 40px 35px;
        }
        .category-form-group {
            margin-bottom: 22px;
        }
        .category-form-label {
            display: block;
            margin-bottom: 8px;
            color: #68705f;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .category-form-control {
            width: 100%;
            background-color: #fffaf3;
            border: 1px solid rgba(39,45,33,0.25);
            border-radius: 2px;
            color: #272d21;
            font-family: "Montserrat", sans-serif;
            font-size: 13px;
            font-weight: 300;
            padding: 11px 13px;
            transition: all 0.25s ease-in-out;
        }
        .category-form-control:focus {
            background-color: #fffaf3;
            border-color: #62794e;
            box-shadow:0 0 0 0.15rem rgba(98,121,78,0.15);
            outline: none;
        }
        .category-form-control::placeholder {
            color: rgba(39,45,33,0.45);
            font-weight: 300;
        }
        textarea.category-form-control {
            resize: vertical;
            min-height: 90px;
        }


        /* =========================
           FILE INPUT
        ========================= */
        input[type="file"].category-form-control {
            padding: 9px 12px;
            cursor: pointer;
        }
        input[type="file"].category-form-control::file-selector-button {
            background-color: #272d21;
            color: #f9ead9;
            border: none;
            padding: 7px 12px;
            margin-right: 10px;
            font-family: "Montserrat", sans-serif;
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.5px;
            cursor: pointer;
        }


        /* =========================
           VALIDATION
        ========================= */
        .category-form-control.is-valid {
            border-color: #62794e;
            background-image: none;
        }
        .category-form-control.is-invalid {
            border-color: rgb(220,116,116);
            background-image: none;
        }
        .invalid-feedback {
            color: rgb(220,116,116);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.3px;
            margin-top: 6px;
        }


        /* =========================
           BUTTON AREA
        ========================= */
        .category-actions {
            border-top: 1px dotted rgba(39,45,33,0.25);
            padding-top: 25px;
            margin-top: 10px;
            text-align: center;
        }
        .category-submit-btn {
            background-color: #272d21;
            color: rgb(149,171,118);
            border: 1px solid #272d21;
            border-radius: 3px;
            min-width: 220px;
            padding: 11px 20px;
            font-family: "Montserrat", sans-serif;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .category-submit-btn:hover {
            background-color: #62794e;
            border-color: #62794e;
            color: white;
        }
        .category-submit-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }


        /* =========================
           FOOTER
        ========================= */
        .footer-Section-last {
            background-color: #272d21;
            color: #62794e;
            font-weight: 200;
            margin-top: auto;
        }
        .icons a {
            display: inline-flex;
            border: 1px solid #62794e;
            width: 50px;
            height: 50px;
            border-radius: 50px;
            align-items: center;
            justify-content: center;
        }
        .icons i {
            font-size: 22px;
            color: #62794e;
        }


        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 767px) {

            .category-main {
                padding: 45px 12px;
            }
            .category-page-title {
                font-size: 25px;
                letter-spacing: 2px;
                margin-bottom: 25px;
            }
            .category-section {
                width: 96%;
            }
            .category-section-header {
                padding: 17px;
            }
            .category-section-header h3 {
                font-size: 15px;
                letter-spacing: 2px;
            }
            .category-form {
                padding: 25px 20px 30px;
            }
            .category-submit-btn {
                width: 100%;
            }
        }
    </style>

</head>


<body>


    <!-- =========================
         NOTIFICATION POPUP YOUR ORIGINAL - UNTOUCHED
    ========================= -->

    <div class="modal fade" id="notificationModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center custom-modal">

                <div class="modal-header border-0 custom-header">
                    <h5 class="mb-0">NH15 Restaurant</h5>
                    <button class="btn btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div id="notificationIconContainer" class="notification-icon">
                        <i id="notificationIconElement"></i>
                    </div>

                    <h3 id="notificationTitle"></h3>
                    <p id="notificationMessage"></p>

                    <button class="btn btn-dark" style="border-radius: 20px; width: 150px; color: rgb(149,171,118);" type="button" data-bs-dismiss="modal">ok</button>

                </div>
            </div>
        </div>
    </div>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="category-main">
        <div style="width:100%;">

            <!-- =========================
                 PAGE TITLE
            ========================= -->
            <h2 class="category-page-title" style="letter-spacing: 0.7rem;">ADD CATEGORY</h2>

            <!-- =========================
                 CATEGORY SECTION
            ========================= -->
            <section class="category-section">

                <div class="category-section-header">
                    <h3>NH15 RESTAURANT</h3>
                    <p>CREATE NEW CATEGORY</p>
                </div>

                <!-- =========================
                     FORM
                ========================= -->

                <div class="category-form">

                    <form id="AddCategory" novalidate>

                        <!-- Category Name -->
                        <div class="category-form-group">
                            <label for="name" class="category-form-label">Category Name</label>
                            <input type="text" name="name" id="name" class="category-form-control" placeholder="Enter category name">
                            <div class="invalid-feedback"></div>
                        </div>

                        <!-- Description -->
                        <div class="category-form-group">
                            <label for="description" class="category-form-label">Category Description</label>
                            <textarea name="description" id="description" rows="3" class="category-form-control" placeholder="Enter category description"></textarea>
                            <div class="invalid-feedback"></div>
                        </div>

                        <!-- Image -->
                        <div class="category-form-group">
                            <label for="imageFile" class="category-form-label">Category Image</label>
                            <input type="file" id="imageFile" class="category-form-control">
                            <div class="invalid-feedback"></div>
                        </div>

                        <!-- Button -->
                        <div class="category-actions">
                            <button type="submit" id="submitBtn" class="btn category-submit-btn">
                                <span id="textBtn">Create Category</span>
                            </button>
                        </div>

                    </form>
                </div>
            </section>

        </div>
    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <section class="footer-Section-last text-center py-5">
        <div class="container">
            <div class="d-flex flex-column flex-lg-row justify-content-center align-items-center gap-5">

                <!-- Address -->
                <div>
                    <h6>Address</h6>
                    <p class="mb-1">Madurdaha Kolkata</p>
                    <p class="mb-0">West Bengal 700107</p>
                </div>

                <!-- Contact -->
                <div>
                    <h6>Contact</h6>
                    <p class="mb-1">Phone: +91 863-8148837</p>
                    <p class="mb-0">Email:nh15restaurantonline@gmail.com</p>
                </div>

                <!-- Opening Hours -->
                <div>
                    <h6>Opening Hours</h6>
                    <p class="mb-1">Mon-Sat: 11AM - 10PM</p>
                    <p class="mb-0">Sunday: Closed</p>
                </div>

                <!-- Social -->
                <div class="icons">
                    <h6>Follow Us</h6>

                    <a href="#" class="text-dark me-3">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="#" class="text-dark me-3">
                        <i class="bi bi-facebook"></i>
                    </a>

                    <a href="#" class="text-dark me-3">
                        <i class="bi bi-linkedin"></i>
                    </a>

                    <a href="#" class="text-dark me-3">
                        <i class="bi bi-twitter-x"></i>
                    </a>
                </div>

            </div>


            <hr>

            <h6 class="fw-light mb-0">&copy; NH15 Restaurant</h6>

        </div>
    </section>



    <script>
        // =====================
        // [ Access Check ]
        // =====================

        function checkUserAccess(){

            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");

            if(!token || role !== "ADMIN"){
                showNotification("error","Access denied!","Please login to access this page.");
                setTimeout(() => {
                    window.location.href = "Login.html";
                },2000);
                return false;
            }
            return true;
        }


        // =====================
        // [ Notification ]
        // =====================
        const notificationModal = document.getElementById("notificationModal");

        function showNotification(type,title,message){

            const notificationIconContainer = document.getElementById("notificationIconContainer");
            const notificationIconElement = document.getElementById("notificationIconElement");
            const notificationTitle = document.getElementById("notificationTitle");
            const notificationMessage = document.getElementById("notificationMessage");

            notificationIconContainer.classList = "notification-icon";

            if(type === "success"){

                notificationIconContainer.classList.add("notification-success");
                notificationIconElement.className = "bi bi-check-circle-fill";
            }
            else if(type === "error"){

                notificationIconContainer.classList.add("notification-error");
                notificationIconElement.className = "bi bi-x-circle-fill";
            }

            notificationTitle.textContent = title;
            notificationMessage.textContent = message;

            const modal = new bootstrap.Modal(notificationModal);
            modal.show();
        }

        // =====================
        // [ Variables ]
        // =====================

        const AddCategory = document.getElementById("AddCategory");
        const name = document.getElementById("name");
        const description = document.getElementById("description");
        const imageFile = document.getElementById("imageFile");
        const submitBtn = document.getElementById("submitBtn");
        const textBtn = document.getElementById("textBtn");

        // =====================
        // [ Show Error ]
        // =====================
        function showError(input,message){
            input.classList.remove("is-valid");
            input.classList.add("is-invalid");
            input.nextElementSibling.innerText = message;
        }

        // =====================
        // [ Show Success ]
        // =====================
        function showSuccess(input){
            input.classList.remove("is-invalid");
            input.classList.add("is-valid");
            input.nextElementSibling.innerText = "";
        }

        // =====================
        // [ Validate Input ]
        // =====================

        function validateInput(){

            let isValid = true;

            // Name
            if(name.value.trim() === ""){
                showError(name,"Category name is required");
                isValid = false;
            }
            else{
                showSuccess(name);
            }

            // Description
            if(description.value.trim() === ""){
                showError(description,"Category description is required");
                isValid = false;
            }
            else{
                showSuccess(description);
            }

            // Image
            if(imageFile.files.length === 0){
                showError(imageFile,"Please select image");
                isValid = false;
            }
            else{
                showSuccess(imageFile);
            }

            return isValid;
        }


        // =====================
        // [ Input Event ]
        // =====================

        AddCategory.addEventListener("input",function(){
            validateInput();
        });



        // =====================
        // [ Submit ]
        // =====================

        AddCategory.addEventListener("submit",async function(e){

                e.preventDefault();

                if(!validateInput()){
                    return;
                }

                const categoryDTO = {
                    name : name.value.trim(),
                    description : description.value.trim()
                };

                const formData = new FormData();

                formData.append("dto",new Blob(
                        [JSON.stringify(categoryDTO)],{
                            type : "application/json"
                        }
                    ));

                formData.append("imageFile",imageFile.files[0]);

                try{

                    const token = localStorage.getItem("token");
                    
                    submitBtn.disabled = true;
                    textBtn.innerText = "Creating...";

                    const response = await fetch("http://localhost:8080/restaurant/admin/api/auth/create-category",{

                            method : "POST",

                            headers: {
                                "Authorization" : "Bearer " + token
                            },

                            body : formData

                        });



                    // =====================
                    // [ 401 ]
                    // =====================
                    if(response.status === 401){

                        localStorage.removeItem("token");
                        showNotification("error","Session expired!","Please restart the forgot password process.");

                        setTimeout(() => {
                            window.location.href ="Login.html";
                        },2000);

                        return;
                    }

                    // =====================
                    // [ 403 ]
                    // =====================
                    if(response.status === 403){

                        showNotification("error","Access denied!","You do not have permission to access this resource");
                        return;
                    }


                    const data = await response.json();

                    if(response.ok){

                        showNotification("success","Success",data.message);

                        AddCategory.reset();

                        [name,description,imageFile].forEach(input => {
                            input.classList.remove("is-valid","is-invalid");
                            input.nextElementSibling.innerText = "";
                        });

                    }else{
                        if(data.name){
                            showError(name,data.name);
                        }

                        if(data.description){
                            showError(description,data.description);
                        }

                        if(data.message){
                            showNotification("error","Error!",data.message);
                        }
                    }
                }

                catch(error){

                    console.log(error);
                    showNotification("error","Server Error!","Please try again later.");
                }

                finally{
                    submitBtn.disabled =false;
                    textBtn.innerText ="Create Category";
                }
            }
        );

        // =====================
        // [ DOM Content Loaded ]
        // =====================

        window.addEventListener("DOMContentLoaded",function(){

            if(!checkUserAccess()){
                return;
            }
        });

    </script>

</body>
</html>
