<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        /* =========================
           MAIN NH15 DESIGN
        ========================= */

        body {
            background-color: #f9ead9;
            color: #272d21;
            font-weight: 300;
            font-family: "Montserrat", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           Notification Pop up
           YOUR ORIGINAL - UNCHANGED
        ========================= */

        #notificationModal {
            z-index: 2000;
        }

        .notification-icon {
            font-size: 55px;
        }

        .notification-success {
            color: rgb(149,171,118);
        }

        .notification-error {
            color: rgb(220, 116, 116);
        }

        .custom-modal {
            background-color: antiquewhite;
            border-radius: 30px;
            overflow: hidden;
        }

        .custom-header {
            background-color: black;
            color: rgb(149,171,118);
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .menu-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .menu-main > div {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================
           PAGE TITLE
        ========================= */

        .menu-page-title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 3px;
            color: #272d21;
            margin-top: 30px;
            margin-bottom: 35px;
            text-align: center;
        }

        /* =========================
           MENU CARD
        ========================= */

        .menu-section {
            width: min(94%, 700px);
            background-color: #fffaf3;
            border: 1px solid rgba(39,45,33,0.25);
            box-shadow: 0 8px 20px rgba(39,45,33,0.15);
            overflow: hidden;
        }

        /* =========================
           CARD HEADER
        ========================= */

        .menu-section-header {
            background-color: #272d21;
            color: #f9ead9;
            padding: 20px;
            text-align: center;
        }

        .menu-section-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 3px;
        }

        .menu-section-header p {
            margin: 6px 0 0;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #62794e;
        }

        /* =========================
           FORM
        ========================= */

        .menu-form {
            padding: 30px 40px 35px;
        }

        .menu-form-group {
            margin-bottom: 20px;
        }

        .menu-form-label {
            display: block;
            margin-bottom: 8px;
            color: #68705f;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .menu-form-control {
            width: 100%;
            background-color: #fffaf3;
            border: 1px solid rgba(39,45,33,0.25);
            border-radius: 2px;
            color: #272d21;
            font-family: "Montserrat", sans-serif;
            font-size: 12px;
            font-weight: 300;
            padding: 11px 13px;
            transition: all .25s ease-in-out;
        }

        .menu-form-control:focus {
            background-color: #fffaf3;
            border-color: #62794e;
            box-shadow: 0 0 0 .15rem rgba(98,121,78,.15);
            outline: none;
        }

        .menu-form-control::placeholder {
            color: rgba(39,45,33,.45);
            font-weight: 300;
        }

        textarea.menu-form-control {
            resize: vertical;
            min-height: 85px;
        }

        input[type="file"].menu-form-control {
            padding: 9px 12px;
            cursor: pointer;
        }

        input[type="file"].menu-form-control::file-selector-button {
            background-color: #272d21;
            color: #f9ead9;
            border: none;
            padding: 7px 12px;
            margin-right: 10px;
            font-family: "Montserrat", sans-serif;
            font-size: 10px;
            font-weight: 300;
            letter-spacing: .5px;
            cursor: pointer;
        }

        select.menu-form-control {
            cursor: pointer;
        }

        .menu-form-control.is-valid {
            border-color: #62794e;
            background-image: none;
        }

        .menu-form-control.is-invalid {
            border-color: rgb(220,116,116);
            background-image: none;
        }

        .invalid-feedback {
            color: rgb(220,116,116);
            font-size: 10px;
            font-weight: 300;
            letter-spacing: .3px;
            margin-top: 6px;
        }

        /* =========================
           BUTTON AREA
        ========================= */

        .menu-actions {
            border-top: 1px dotted rgba(39,45,33,.25);
            padding-top: 25px;
            margin-top: 10px;
            text-align: center;
        }

        .menu-submit-btn {
            background-color: #272d21;
            color: rgb(149,171,118);
            border: 1px solid #272d21;
            border-radius: 3px;
            min-width: 220px;
            padding: 11px 20px;
            font-family: "Montserrat", sans-serif;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 1px;
            transition: all .3s ease;
        }

        .menu-submit-btn:hover {
            background-color: #62794e;
            border-color: #62794e;
            color: white;
        }

        .menu-submit-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer-Section-last {
            background-color: #272d21;
            color: #62794e;
            font-weight: 200;
            margin-top: auto;
        }

        .icons a {
            display: inline-flex;
            border: 1px solid #62794e;
            width: 50px;
            height: 50px;
            border-radius: 50px;
            align-items: center;
            justify-content: center;
        }

        .icons i {
            font-size: 22px;
            color: #62794e;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {
            .menu-main {
                padding: 25px 15px;
            }

            .menu-page-title {
                font-size: 25px;
                letter-spacing: 2px;
                margin-top: 20px;
                margin-bottom: 25px;
            }

            .menu-section {
                width: 96%;
            }

            .menu-section-header {
                padding: 17px 15px;
            }

            .menu-section-header h3 {
                font-size: 16px;
                letter-spacing: 2px;
            }

            .menu-section-header p {
                font-size: 9px;
            }

            .menu-form {
                padding: 25px 20px 30px;
            }

            .menu-submit-btn {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>

<body>

    <!--Notification Pop Up -->
    <!-- YOUR ORIGINAL NOTIFICATION - UNCHANGED -->

    <div class="modal fade" id="notificationModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center custom-modal">
                <div class="modal-header border-0 custom-header">
                    <h5 class="mb-0">NH15 Restaurant</h5>
                    <button class="btn btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div id="notificationIconContainer" class="notification-icon">
                        <i id="notificationIconElement"></i>
                    </div>

                    <h3 id="notificationTitle"></h3>
                    <p id="notificationMessage"></p>

                    <button class="btn btn-dark" style="border-radius: 20px; width: 150px; color: rgb(149,171,118);" type="button" data-bs-dismiss="modal">ok</button>
                </div>
            </div>
        </div>
    </div>

    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="menu-main">
        <div>
            <h2 class="menu-page-title" style="letter-spacing: 0.7rem;">ADD MENU</h2>

            <section class="menu-section">
                <div class="menu-section-header">
                    <h3>RESTAURANT MENU</h3>
                    <p>ADD A NEW FOOD ITEM</p>
                </div>

                <form id="AddMenu" class="menu-form" novalidate>

                    <!-- Name -->

                    <div class="menu-form-group">
                        <label for="name" class="menu-form-label">Name</label>
                        <input type="text" name="name" id="name" class="menu-form-control" placeholder="Enter Menu name">
                        <div class="invalid-feedback"></div>
                    </div>

                    <!-- Description -->

                    <div class="menu-form-group">
                        <label for="description" class="menu-form-label">Description</label>
                        <textarea name="description" id="description" class="menu-form-control" rows="2" placeholder="Enter Menu description"></textarea>
                        <div class="invalid-feedback"></div>
                    </div>

                    <!-- Price -->

                    <div class="menu-form-group">
                        <label for="price" class="menu-form-label">Price</label>
                        <input type="text" name="price" id="price" class="menu-form-control" placeholder="Enter Price">
                        <div class="invalid-feedback"></div>
                    </div>

                    <!-- Image -->

                    <div class="menu-form-group">
                        <label for="imageUrl" class="menu-form-label">Menu image</label>
                        <input type="file" name="imageUrl" id="imageUrl" class="menu-form-control">
                        <div class="invalid-feedback"></div>
                    </div>

                    <!-- IsAvailable -->

                    <div class="menu-form-group">
                        <label for="isAvailable" class="menu-form-label">Availability</label>
                        <select name="isAvailable" id="isAvailable" class="menu-form-control">
                            <option value="">Select availability</option>
                            <option value="true">Available</option>
                            <option value="false">Non Available</option>
                        </select>
                        <div class="invalid-feedback"></div>
                    </div>

                    <!-- IsVeg -->

                    <div class="menu-form-group">
                        <label for="isVeg" class="menu-form-label">Food type</label>
                        <select name="isVeg" id="isVeg" class="menu-form-control">
                            <option value="">Select type</option>
                            <option value="true">Veg</option>
                            <option value="false">Non Veg</option>
                        </select>
                        <div class="invalid-feedback"></div>
                    </div>

                    <!-- Preparation time -->

                    <div class="menu-form-group">
                        <label for="preprationtime" class="menu-form-label">Preparation time</label>
                        <input type="text" name="preprationtime" id="preprationtime" class="menu-form-control" placeholder="Enter preparation time">
                        <div class="invalid-feedback"></div>
                    </div>

                    <!-- Stock -->

                    <div class="menu-form-group">
                        <label for="stock" class="menu-form-label">Stock</label>
                        <input type="text" name="stock" id="stock" class="menu-form-control" placeholder="Enter stock">
                        <div class="invalid-feedback"></div>
                    </div>

                    <!-- Category Id -->

                    <div class="menu-form-group">
                        <label for="category_id" class="menu-form-label">Category id</label>
                        <input type="text" name="category_id" id="category_id" class="menu-form-control" placeholder="Enter category id">
                        <div class="invalid-feedback"></div>
                    </div>

                    <!-- Button -->

                    <div class="menu-actions">
                        <button type="submit" id="submitBtn" class="menu-submit-btn"><span id="textBtn">Create menu</span></button>
                    </div>

                </form>
            </section>
        </div>
    </main>

    <!-- =========================
         FOOTER
    ========================= -->

    <section class="footer-Section-last text-center py-5">
        <div class="container">
            <div class="d-flex flex-column flex-lg-row justify-content-center align-items-center gap-5">

                <!-- Address -->

                <div>
                    <h6>Address</h6>
                    <p class="mb-1">Madurdaha Kolkata</p>
                    <p class="mb-0">West Bengal 700107</p>
                </div>

                <!-- Contact -->

                <div>
                    <h6>Contact</h6>
                    <p class="mb-1">Phone: +91 863-8148837</p>
                    <p class="mb-0">Email: nh15restaurantonline@gmail.com</p>
                </div>

                <!-- Opening Hours -->

                <div>
                    <h6>Opening Hours</h6>
                    <p class="mb-1">Mon-Sat: 11AM - 10PM</p>
                    <p class="mb-0">Sunday: Closed</p>
                </div>

                <!-- Social -->

                <div class="icons">
                    <h6>Follow Us</h6>
                    <a href="#" class="text-dark me-3"><i class="bi bi-instagram"></i></a>
                    <a href="#" class="text-dark me-3"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="text-dark me-3"><i class="bi bi-linkedin"></i></a>
                    <a href="#" class="text-dark me-3"><i class="bi bi-twitter-x"></i></a>
                </div>
            </div>

            <hr>

            <h6 class="fw-light mb-0">&copy; NH15 Restaurant</h6>
        </div>
    </section>

    <script>
        // =====================
        // [    Access Check   ]
        // =====================

        function checkUserAccess() {
            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");

            if (!token || role !== "ADMIN") {
                showNotification("error", "Access denied!", "Please login to access this page.");

                setTimeout(() => {
                    window.location.href = "Login.html";
                },2000);

                return false;
            }

            return true;
        }

        const notificationModal = document.getElementById("notificationModal");

        function showNotification(type,title,message) {
            const notificationIconContainer = document.getElementById("notificationIconContainer");
            const notificationIconElement = document.getElementById("notificationIconElement");
            const notificationTitle = document.getElementById("notificationTitle");
            const notificationMessage = document.getElementById("notificationMessage");

            notificationIconContainer.classList = "notification-icon";

            if(type === "success") {
                notificationIconContainer.classList.add("notification-success");
                notificationIconElement.className = "bi bi-check-circle-fill";
            }else if(type === "error") {
                notificationIconContainer.classList.add("notification-error");
                notificationIconElement.className = "bi bi-x-circle-fill";
            }

            notificationTitle.textContent = title;
            notificationMessage.textContent = message;

            const modal = new bootstrap.Modal(notificationModal);
            modal.show();
        }

        const AddMenu = document.getElementById("AddMenu");
        const name = document.getElementById("name");
        const description = document.getElementById("description");
        const price = document.getElementById("price");
        const imageUrl = document.getElementById("imageUrl");
        const isAvailable = document.getElementById("isAvailable");
        const isVeg = document.getElementById("isVeg");
        const preprationtime = document.getElementById("preprationtime");
        const stock = document.getElementById("stock");
        const category_id = document.getElementById("category_id");
        const submitBtn = document.getElementById("submitBtn");
        const textBtn = document.getElementById("textBtn");

        // 1st Function

        function showError(input,message) {
            input.classList.remove("is-valid");
            input.classList.add("is-invalid");
            input.nextElementSibling.innerText = message;
        }

        // 2nd Function

        function showSuccess(input) {
            input.classList.remove("is-invalid");
            input.classList.add("is-valid");
            input.nextElementSibling.innerText = "";
        }

        // 3rd Function

        function validateInputs() {
            let Valid = true;

            // Name validate

            if(name.value.trim() === "") {
                showError(name, "Item name is required");
                Valid = false;
            }else {
                showSuccess(name);
            }

            // Description validate

            if(description.value.trim() === "") {
                showError(description, "Item description is required");
                Valid = false;
            }else {
                showSuccess(description);
            }

            // Price validate

            if(price.value.trim() === "") {
                showError(price, "Item price is required");
                Valid = false;
            }else {
                showSuccess(price);
            }

            // Image validate

            if(imageUrl.value.trim() === "") {
                showError(imageUrl, "Item image URL is required");
                Valid = false;
            }else {
                showSuccess(imageUrl);
            }

            // Availability validate

            if(isAvailable.value.trim() === "") {
                showError(isAvailable, "Item availability is required");
                Valid = false;
            }else {
                showSuccess(isAvailable);
            }

            // Food type validate

            if(isVeg.value.trim() === "") {
                showError(isVeg, "Item food type is required");
                Valid = false;
            }else {
                showSuccess(isVeg);
            }

            // Preparation validate

            if(preprationtime.value.trim() === "") {
                showError(preprationtime, "Item preparation time is required");
                Valid = false;
            }else {
                showSuccess(preprationtime);
            }

            // Stock validate

            if(stock.value.trim() === "") {
                showError(stock, "Item Stock is required");
                Valid = false;
            }else {
                showSuccess(stock);
            }

            // Category ID validate

            if(category_id.value.trim() === "") {
                showError(category_id, "Category Id is required");
                Valid = false;
            }else {
                showSuccess(category_id);
            }

            return Valid;
        }

        // 1st Event

        AddMenu.addEventListener("input", function() {
            validateInputs();
        });

        // 2nd Event

        AddMenu.addEventListener("submit", async function(e) {
            e.preventDefault();

            if(!validateInputs()) {
                return;
            }

            const menuItem = {
                name : name.value.trim(),
                description : description.value.trim(),
                price : parseFloat(price.value),
                isAvailable : isAvailable.value === "true",
                isVeg : isVeg.value === "true",
                preprationtime : preprationtime.value.trim(),
                stock : parseInt(stock.value),
                category_id : parseInt(category_id.value),
            };

            const formData = new FormData();

            formData.append(
                "dto",
                new Blob(
                    [JSON.stringify(menuItem)],
                    {
                        type : "application/json"
                    }
                )
            );

            formData.append("imageFile", imageUrl.files[0]);

            try {
                const token = localStorage.getItem("token");

                submitBtn.disabled = true;
                textBtn.innerText = "Creating menu...";

                const response = await fetch(
                    "http://localhost:8080/restaurant/admin/api/create-menu",
                    {
                        method : "POST",
                        headers : {
                            "Authorization": "Bearer " + token
                        },
                        body : formData
                    }
                );

                // =====================
                // [  AUT - 401 & 403  ]
                // =====================

                if(response.status === 401) {
                    localStorage.removeItem("token");

                    showNotification("error", "Session expired!", "Please restart the forgot password process.");

                    setTimeout(() => {
                        window.location.href = "Login.html";
                    },2000);

                    return;
                }

                if(response.status === 403) {
                    showNotification("error", "Access denied!", "You do not have permission to access this resource");
                    return;
                }

                const data = await response.json();

                if(response.ok) {
                    showNotification("success", "Success", data.message);

                    AddMenu.reset();

                    [
                        name,
                        description,
                        price,
                        imageUrl,
                        isAvailable,
                        isVeg,
                        preprationtime,
                        stock,
                        category_id
                    ].forEach(input => {
                        input.classList.remove("is-invalid", "is-valid");
                        input.nextElementSibling.innerText = "";
                    });

                }else {
                    if(data.name) {
                        showError(name, data.name);
                    }

                    if(data.description) {
                        showError(description, data.description);
                    }

                    if(data.price) {
                        showError(price, data.price);
                    }

                    if(data.imageUrl) {
                        showError(imageUrl, data.imageUrl);
                    }

                    if(data.isAvailable) {
                        showError(isAvailable, data.isAvailable);
                    }

                    if(data.isVeg) {
                        showError(isVeg, data.isVeg);
                    }

                    if(data.preprationtime) {
                        showError(preprationtime, data.preprationtime);
                    }

                    if(data.stock) {
                        showError(stock, data.stock);
                    }

                    if(data.category_id) {
                        showError(category_id, data.category_id);
                    }

                    if(data.message) {
                        showNotification("error", "Error!", data.message);
                    }
                }

            } catch (error) {
                console.log(error);
                showNotification("error", "Server error!", "Please try again later.");

            } finally {
                submitBtn.disabled = false;
                textBtn.innerText = "Create menu";
            }
        });

        // =========================
        // MAIN FUNCTION
        // =========================

        window.addEventListener("DOMContentLoaded", function() {
            if(!checkUserAccess()) {
                return;
            }
        });
    </script>

</body>
</html>
