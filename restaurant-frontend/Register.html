<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style> 
        body{
            font-family: "Montserrat", sans-serif;  
            /* background-color: #272d21; */
        }
        

        /* Main-Section-Parent */
          .Main-Section-Parent{
            position: relative;
            height: 850px;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .MainLogo-Image{
            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position:right center;
            position: absolute;
            top: 0;
            left: 0;

            z-index: -1;
        }
        .Main-Section-Parent{
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }







        /* Register Card */
        .card{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            width: min(90%,500px);
            background-color: rgba(250, 235, 215, 0.544);
            text-align: center;
        }

        .Input-One{
            background: antiquewhite;
            transition: all 1.35s ease-in-out;
            padding: 14px 40px;
            border: 1px solid antiquewhite;
        }
        .Input-One:hover{
            background-color: rgb(149, 171, 118);
            letter-spacing: 2px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }
        .bttnn{
            border: 1px solid rgb(0, 0, 0);
            background-color: black;
            border-radius: 40px;
            padding: 10px;
            color: rgb(149, 171, 118);
            font-weight: 400;
        }
        
        .bttnn:hover{
            border: 1px solid rgb(0, 0, 0);
            color: rgb(0, 0, 0);
            transition: all 0.25s ease-in-out;
            background-color: rgb(149, 171, 118);
        }
        .form-control:focus{
            background-color: rgb(227, 144, 144);
        }
        .register-btn{
            color: rgb(7, 48, 15);
        }
        .register-btn:hover{
            color: rgb(7, 48, 15);
        }





        /* Notification Pop up */
        .notification-icon{
            font-size: 55px;
        }

        .notification-success{
            color: rgb(77, 238, 77);
        }

        .notification-error{
            color: rgb(248, 62, 62);
        }

        .modal-content{
            background-color: antiquewhite;
            border-radius: 30px;
            overflow: hidden;
        }

        .modal-header{
            background-color: black;
            color: rgb(149,171,118);
        }



        /* Footer Section */
        .footer-Section-last{
            background-color: #272d21;
            color: #62794e;
            font-weight: 200;
        }

        .icons a{
            display: inline-flex;
            border: 1px solid #62794e;
            width: 50px;
            height: 50px;
            border-radius: 50px;
            align-items: center;
            justify-content: center;
        }

        .icons i{
            font-size: 22px;
            color: #62794e;
        }

    </style> 

</head>
<body>
    <section class="Main-Section-Parent">
        <img src="67F18543-FEF8-4CA4-AFC2-BAAF29CBDE53.PNG" alt="mainlogo" class="MainLogo-Image shadow-lg">

        <div class="card shadow-lg border-0">
            <div class="card-body">
                <h3 class="ms-auto card-title">R E G I S T E R</h3>

                <form id="RegisterForm" novalidate>

                    <div class="mt-3 mb-3">
                        <label for="name" class="form-label text-start d-block">N a m e</label>
                        <input type="text" class="form-control shadow-lg Input-One text-center" name="name" id="name" placeholder="Y o u r  N a m e">
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="mt-3 mb-3">
                        <label for="email" class="form-label text-start d-block">E m a i l</label>
                        <input type="email" class="form-control shadow-lg Input-One text-center" name="email" id="email" placeholder="Y o u r  E m a i l">
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="mt-3 mb-3">
                        <label for="phonenumber" class="form-label text-start d-block">P h o n e  N u m b e r</label>
                        <input type="text" class="form-control shadow-lg Input-One text-center" name="phonenumber" id="phonenumber" placeholder="Y o u r  P h o n e  N u m b e r">
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="mt-3 mb-3">
                        <label for="address" class="form-label text-start d-block">A d d r e s s</label>
                        <input type="text" class="form-control shadow-lg Input-One text-center" name="address" id="address" placeholder="Y o u r  A d d r e s s">
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="mt-3 mb-3">
                        <label for="password" class="form-label text-start d-block">P a s s w o r d</label>
                        <input type="password" class="form-control shadow-lg Input-One text-center" name="password" id="password" placeholder="P a s s w o r d">
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="mt-3 mb-3">
                        <label for="confirmpassword" class="form-label text-start d-block">C o n f i r m  P a s s w o r d</label>
                        <input type="password" class="form-control shadow-lg Input-One text-center" name="confirmpassword" id="confirmpassword" placeholder="C o n f i r m  P a s s w o r d">
                        <div class="invalid-feedback"></div>
                    </div>
                    
                    <button class="bttnn w-50" type="submit" id="submitBtn">
                        <span id="textBtn">Register</span>
                    </button>

                </form>

                <div class="back-btn-part">
                    <a href="Login.html" class="register-btn">back</a>
                </div>
            </div>
        </div>
    </section>


    <!-- Footer Section -->
    <section class="footer-Section-last text-center py-5">
            <div class="container">
                <div class="d-flex flex-column flex-lg-row justify-content-center align-items-center gap-5 gap-lg-5">

      
                    <div>
                        <h6>Address</h6>
                        <p class="mb-1">Madurdaha Kolkata</p>
                        <p class="mb-0">West bengal 700107</p>
                    </div>

                    <div>
                        <h6>Contact</h6>
                        <p class="mb-1">Phone: +91 863-8148837</p>
                        <p class="mb-0">Email: nh15restaurantonline@gmail.com</p>
                    </div>

         
                    <div>
                        <h6>Opening Hours</h6>
                        <p class="mb-1">Mon-Sat: 11AM - 10PM</p>
                        <p class="mb-0">Sunday: Closed</p>
                    </div>

                    <div class="icons">
                        <h6>Follow Us</h6>
                        <a href="#" class="text-dark me-3"><i class="bi bi-instagram"></i></a>
                        <a href="#" class="text-dark me-3"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="text-dark me-3"><i class="bi bi-linkedin"></i></a>
                        <a href="#" class="text-dark me-3"><i class="bi bi-twitter-x"></i></a>
                    </div>

                </div>
                
                <hr>
                <h6 class="fw-light mb-0">&copy; NH15 Restaurant</h6>
            </div>
        </section>

 

    <!--Notification Pop Up -->
    <div class="modal fade" id="notificationModal">
        <div class="modal-dialog modal-dialog-centered" >
            <div class="modal-content text-center">

                <div class="modal-header border-0">
                    <h5 class="mb-0">NH15 Restaurant</h5>
                    <button class="btn btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div id="notificationIconContainer" class="notification-icon">
                        <i id="notificationIconElement"></i>
                    </div>

                    <h3 id="notificationTitle"></h3>

                    <p id="notificationMessage"></p>

                    <button class="btn btn-dark" style="border-radius: 20px; width: 150px; color: rgb(149,171,118);" type="button" data-bs-dismiss="modal">ok</button>
                </div>

            </div>
        </div>
    </div>



    <script>
 
        const notificationModal = document.getElementById("notificationModal");
         
        function showNotification(type,title,message){

            const notificationIconContainer = document.getElementById("notificationIconContainer");
            const notificationIconElement = document.getElementById("notificationIconElement");
            const notificationTitle = document.getElementById("notificationTitle");
            const notificationMessage = document.getElementById("notificationMessage");

            notificationIconContainer.classList = "notification-icon";

            if(type === "success"){

                notificationIconContainer.classList.add("notification-success");
                notificationIconElement.className = "bi bi-check-circle-fill";

            }else if(type === "error"){

                notificationIconContainer.classList.add("notification-error");               
                notificationIconElement.className = "bi bi-x-circle-fill";
 
            }

            notificationTitle.textContent = title;
            notificationMessage.textContent = message;

            const modal = new bootstrap.Modal(notificationModal);
            modal.show();
        }




        const RegisterForm = document.getElementById("RegisterForm");

        const name = document.getElementById("name");
        const email = document.getElementById("email");
        const phonenumber = document.getElementById("phonenumber");
        const address = document.getElementById("address");
        const password = document.getElementById("password");
        const confirmpassword = document.getElementById("confirmpassword");

        const submitBtn = document.getElementById("submitBtn");
        const textBtn = document.getElementById("textBtn");

        // 1st funtion 
        function showError(input,message){
            input.classList.remove("is-valid");
            input.classList.add("is-invalid");

            input.nextElementSibling.innerText = message;
        }

        // 2nd funtion
        function showSuccess(input){
            input.classList.remove("is-invalid");
            input.classList.add("is-valid");

            input.nextElementSibling.innerText = "";
        }

        // 3rd funtion
        function validateInputs(){

            let isvalid = true;

            // name validation
            if(name.value.trim() === ""){
                showError(name,"Name is required.");
                isvalid = false;
            }else{
                showSuccess(name);
            }

            // email validation
            if(email.value.trim() === ""){
                showError(email,"Email is required.");
                isvalid = false;
            }else{
                showSuccess(email);
            }

            // phone no validation
            if(phonenumber.value.trim() === ""){
                showError(phonenumber,"Phone no is required.");
                isvalid = false;
            }else{
                showSuccess(phonenumber);
            }

            // address validation
            if(address.value.trim() === ""){
                showError(address,"Address is required.");
                isvalid = false;
            }else{
                showSuccess(address);
            }

            // Password validation
            if(password.value.trim().length < 6){
                showError(password,"Password must be at least 6 characters long.");
                isvalid = false;
            }else{
                showSuccess(password);
            }

            // confirmpassword validation
            if(confirmpassword.value.trim() === "" || confirmpassword.value !== password.value){
                showError(confirmpassword,"Password do not match.");
                isvalid = false;
            }else{
                showSuccess(confirmpassword);
            }

            return isvalid;
        }

        // 1st Event
        RegisterForm.addEventListener("input",function(){
            validateInputs();
        });

        // 2nd Event
        RegisterForm.addEventListener("submit",async function(e){

            e.preventDefault();

            if(!validateInputs()){
                return;
            }

            const user = {
                name : name.value.trim(),
                email : email.value.trim(),
                phonenumber : phonenumber.value.trim(),
                address : address.value.trim(),
                password : password.value.trim()
            };

            try {
                submitBtn.disabled = true;
                textBtn.innerText = "Registering...";

                const response = await fetch("https://restaurant-project-production-38d4.up.railway.app/restaurant/api/auth/register",{

                    method : "POST",

                    headers : {
                        "Content-Type":"application/json"
                    },

                    body : JSON.stringify(user)
                });
 
                const data = await response.json();

                if(response.ok){

                    showNotification("success","Successful",data.message);

                    setTimeout(() => {
                        window.location.href = "Login.html";
                    },2000);

                    RegisterForm.reset();

                    [name,email,phonenumber,address,password,confirmpassword]
                    .forEach(input => {
                        input.classList.remove("is-invalid","is-valid");
                        input.nextElementSibling.innerText = "";
                    });

                }else{
                    if(typeof data === "object"){
 
                        if(data.name){
                            showError(name,data.name);
                        }

                        if(data.email){
                            showError(email,data.email);
                        }

                        if(data.phonenumber){
                            showError(phonenumber,data.phonenumber);
                        }
 
                        if(data.address){
                            showError(address,data.address);
                        }

                        if(data.password){
                            showError(password,data.password);
                        }

                        if(data.message){
                            showNotification("error","Error!",data.message);
                        }
                    }
                }

            } catch (error) {
                console.log(error);
                showNotification("error","Server error!","Please try again later.");
            }

            finally{
                submitBtn.disabled = false;
                textBtn.innerText = "Register";
            }

        });

    </script>
</body>
</html>
