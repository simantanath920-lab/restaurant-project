<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>NH15 | Category Management</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        /* =========================
           NH15 MAIN THEME
        ========================= */

        body {
            background-color: #f9ead9;
            color: #272d21;
            font-weight: 300;
            font-family: "Montserrat", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .category-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .category-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 3px;
            color: #272d21;
            text-align: center;
            margin-bottom: 10px;
        }

        .page-subtitle {
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #62794e;
            text-align: center;
            margin-bottom: 35px;
        }

        /* =========================
           CATEGORY CARD
        ========================= */

        .category-card {
            width: min(94%, 850px);
            background-color: #fffaf3;
            border: 1px solid rgba(39, 45, 33, 0.25);
            box-shadow: 0 8px 20px rgba(39, 45, 33, 0.15);
            padding: 35px;
        }

        /* =========================
           CATEGORY GRID
        ========================= */

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        /* =========================
           CATEGORY ITEM
        ========================= */

        .category-item {
            min-height: 190px;
            background-color: #f9ead9;
            border: 1px solid rgba(39, 45, 33, 0.20);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: #272d21;
            padding: 25px 15px;
            transition: 0.25s ease;
        }

        .category-item i {
            font-size: 45px;
            color: #62794e;
            margin-bottom: 18px;
            transition: 0.25s ease;
        }

        .category-item p {
            margin: 0;
            color: #272d21;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .category-item:hover {
            background-color: #272d21;
            border-color: #62794e;
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(39, 45, 33, 0.18);
        }

        .category-item:hover i {
            color: rgb(149,171,118);
        }

        .category-item:hover p {
            color: #f9ead9;
        }

        /* =========================
           FOOTER
        ========================= */

        /* Footer Section */

        .footer-Section-last{
            background-color: #272d21; 
            color: #a7bd94;
            font-weight: 500;
        }

        .icons a{
            display: inline-flex;
            border: 1px solid #dfe6d8;
            width: 50px;
            height: 50px;
            border-radius: 50px;
            align-items: center;
            justify-content: center;
        }

        .icons i{
            font-size: 22px;
            color: #a7bd94;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 767px) {
            .category-main {
                padding: 35px 15px;
            }

            .page-title {
                font-size: 25px;
                letter-spacing: 2px;
            }

            .page-subtitle {
                font-size: 9px;
                letter-spacing: 1.5px;
                margin-bottom: 25px;
            }

            .category-card {
                width: 96%;
                padding: 20px;
            }

            .category-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .category-item {
                min-height: 145px;
            }

            .category-item i {
                font-size: 38px;
            }
        }

        /* =========================
           SMALL MOBILE
        ========================= */

        @media (min-width: 500px) and (max-width: 768px) {
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="category-main">
        <div class="category-container">
            <h1 class="page-title" style="letter-spacing: 0.7rem;">CATEGORY MANAGEMENT</h1>

            <p class="page-subtitle">NH15 RESTAURANT</p>

            <div class="category-card">
                <div class="category-grid">

                    <!-- Add Category -->

                    <a href="ADMIN_CATEGORY_Create.html" class="category-item">
                        <i class="bi bi-bag-plus-fill"></i>
                        <p>Add Category</p>
                    </a>

                    <!-- Available Categories -->

                    <a href="ADMIN_CATEGORY_View_All_Available.html" class="category-item">
                        <i class="bi bi-binoculars-fill"></i>
                        <p>View All Available Category</p>
                    </a>

                    <!-- All Categories -->

                    <a href="ADMIN_CATEGORY_View_All.html" class="category-item">
                        <i class="bi bi-view-list"></i>
                        <p>View All Category</p>
                    </a>

                </div>
            </div>
        </div>
    </main>

    <!-- =========================
         FOOTER
    ========================= -->

    <!-- Footer Section -->

    <section class="footer-Section-last text-center py-5">
        <div class="container">
            <div class="d-flex flex-column flex-lg-row justify-content-center align-items-center gap-5 gap-lg-5">

                <!-- Address -->

                <div>
                    <h6>Address</h6>
                    <p class="mb-1">Madurdaha Kolkata</p>
                    <p class="mb-0">West bengal 700107</p>
                </div>

                <!-- Contact -->

                <div>
                    <h6>Contact</h6>
                    <p class="mb-1">Phone: +91 863-8148837</p>
                    <p class="mb-0">Email: nh15restaurantonline@gmail.com</p>
                </div>

                <!-- Opening Hours -->

                <div>
                    <h6>Opening Hours</h6>
                    <p class="mb-1">Mon-Sat: 11AM - 10PM</p>
                    <p class="mb-0">Sunday: Closed</p>
                </div>

                <div class="icons">
                    <h6>Follow Us</h6>

                    <a href="#" class="text-dark me-3"><i class="bi bi-instagram"></i></a>
                    <a href="#" class="text-dark me-3"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="text-dark me-3"><i class="bi bi-linkedin"></i></a>
                    <a href="#" class="text-dark me-3"><i class="bi bi-twitter-x"></i></a>
                </div>

            </div>

            <hr>

            <h6 class="fw-light mb-0">&copy; NH15 Restaurant</h6>
        </div>
    </section>

    <script>
        // =====================
        // [    Access Check   ]
        // =====================

        function checkUserAccess() {
            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");

            if (!token || role !== "ADMIN") {
                showNotification("error","Access denied!","Please login to access this page.");
                setTimeout(() => {
                    window.location.href = "Login.html";
                },2000);
                return false;
            }
            return true;
        }

        // =========================
        // DOM CONTENT LOADED
        // =========================

        window.addEventListener("DOMContentLoaded", function() {
            if (!checkUserAccess()) {
                return;
            }
        });
    </script>

</body>
</html>
