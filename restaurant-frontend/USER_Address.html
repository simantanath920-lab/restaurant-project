<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>

        body {
            background-color: #f9ead9;
            color: #272d21;
            font-weight: 300;
            font-family: "Montserrat", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* =========================
           Notification Pop up
        ========================= */

        #notificationModal {
            z-index: 2000;
        }

        .notification-icon {
            font-size: 55px;
        }

        .notification-success {
            color: rgb(149,171,118);
        }

        .notification-error {
            color: rgb(220, 116, 116);
        }

        .custom-modal {
            background-color: antiquewhite;
            border-radius: 30px;
            overflow: hidden;
        }

        .custom-header {
            background-color: black;
            color: rgb(149,171,118);
        }


        /* =========================
           Page Heading
        ========================= */

        .address-page-title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 3px;
            color: #272d21;
        }


        /* =========================
           Address Card
        ========================= */

        .address-card {
            background-color: rgba(249, 234, 217, 0.92);
            border: 1px solid rgba(39, 45, 33, 0.25) !important;
            border-radius: 12px !important;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .address-card:hover {
            transform: translateY(-5px);
            border-color: #62794e !important;
            box-shadow: 0 10px 25px rgba(39, 45, 33, 0.18) !important;
        }

        .address-card.border-success {
            border: 1px solid #62794e !important;
            box-shadow: 0 0 0 1px #62794e, 0 10px 25px rgba(39, 45, 33, 0.15) !important;
        }


        /* =========================
           Card Body
        ========================= */

        .address-card .card-body {
            padding: 25px;
        }

        .address-card p {
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.5px;
            color: #272d21;
        }

        .address-card p strong {
            display: inline-block;
            min-width: 105px;
            font-weight: 300;
            color: #62794e;
        }


        /* =========================
           Card Footer
        ========================= */

        .address-card .card-footer {
            background-color: #272d21 !important;
            padding: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .address-card .card-footer button {
            flex: 1;
            background-color: transparent;
            color: #f9ead9;
            border: 1px solid rgba(249, 234, 217, 0.45);
            border-radius: 3px;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.7px;
            padding: 7px 10px;
            transition: all 0.3s ease;
        }

        .address-card .card-footer button:hover {
            background-color: #62794e;
            border-color: #62794e;
            color: white;
        }


        /* =========================
           Continue Checkout
        ========================= */

        .checkout-button {
            background-color: #272d21;
            color: #f9ead9;
            border: 1px solid #62794e;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 1px;
            padding: 9px 20px;
            transition: all 0.3s ease;
        }

        .checkout-button:hover {
            background-color: #62794e;
            color: white;
        }


        /* =========================
           No Address
        ========================= */

        .no-address-card {
            background-color: rgba(249, 234, 217, 0.92);
            border: 1px solid rgba(39, 45, 33, 0.25);
            border-radius: 12px;
            padding: 40px 20px;
        }

        .no-address-card h3 {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }


        /* =========================
           Add New Button
        ========================= */

        .add-address-button {
            background-color: #272d21;
            color: #f9ead9;
            border: 1px solid #62794e;
            border-radius: 3px;
            font-weight: 300;
            letter-spacing: 1px;
            padding: 8px 25px;
            transition: all 0.3s ease;
        }

        .add-address-button:hover {
            background-color: #62794e;
            color: white;
        }


        /* =========================
           Add Address Cart
        ========================= */

        .Input-One {
            background: antiquewhite;
            transition: all 1.35s ease-in-out;
            padding: 14px 40px;
            border: 1px solid antiquewhite;
        }

        .Input-One:hover {
            background-color: rgb(149, 171, 118);
            letter-spacing: 2px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        .bttnn {
            border: 1px solid rgb(0, 0, 0);
            background-color: black;
            border-radius: 40px;
            padding: 10px;
            color: rgb(149, 171, 118);
            font-weight: 400;
        }

        .bttnn:hover {
            border: 1px solid rgb(0, 0, 0);
            color: rgb(0, 0, 0);
            transition: all 0.25s ease-in-out;
            background-color: rgb(149, 171, 118);
        }

        .form-control:focus {
            background-color: rgb(227, 144, 144);
        }

        .register-btn {
            color: rgb(7, 48, 15);
        }

        .register-btn:hover {
            color: rgb(7, 48, 15);
        }

        /* Remove Bootstrap validation icons */
        .form-control.is-valid,
        .form-control.is-invalid,
        .form-select.is-valid,
        .form-select.is-invalid {
            background-image: none !important;
            padding-right: 40px !important;
        }


        /* =========================
           Footer Section
        ========================= */

        .footer-Section-last{
            background-color: #272d21;

            font-weight: 500;
        }

        .icons a{

            height: 50px;
            border-radius: 50px;
            align-items: center;
            justify-content: center;
        }

        .icons i{
            font-size: 22px;
            color: #a7bd94;
        }

    </style>
</head>

    <script>

        // =====================
        // [    Access Check   ]
        // =====================

        function checkUserAccess() {

            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");

            if (!token || role !== "USER") {

                showNotification("error","Access denied!","Please login to access this page.");

                setTimeout(() => {
                    window.location.href = "Login.html";
                },2000);

                return false;
            }

            return true;
        }


        const notificationModal = document.getElementById("notificationModal");

        function showNotification(type,title,message) {

            const notificationIconContainer = document.getElementById("notificationIconContainer");
            const notificationIconElement = document.getElementById("notificationIconElement");
            const notificationTitle = document.getElementById("notificationTitle");
            const notificationMessage = document.getElementById("notificationMessage");

            notificationIconContainer.classList = "notification-icon";

            if (type === "success") {

                notificationIconContainer.classList.add("notification-success");
                notificationIconElement.className = "bi bi-check-circle-fill";

            } else if (type === "error") {

                notificationIconContainer.classList.add("notification-error");
                notificationIconElement.className = "bi bi-x-circle-fill";
            }

            notificationTitle.textContent = title;
            notificationMessage.textContent = message;

            const modal = new bootstrap.Modal(notificationModal);
            modal.show();
        }


        const userId = localStorage.getItem("userId");
        const UserAddress = document.getElementById("UserAddress");

        let allAddress = [];


        // =========================
        // 5 View Addresses
        // =========================

        async function viewAddress() {

            const token = localStorage.getItem("token");

            try {

                const response = await fetch(`https://restaurant-project-production-38d4.up.railway.app/restaurant/user/api/address/view/${userId}`, {

                    method : "GET",

                    headers : {
                        "Authorization":"Bearer " + token
                    }
                });


                // =====================
                // [  AUT - 401 & 403  ]
                // =====================

                if (response.status === 401) {

                    localStorage.removeItem("token");

                    showNotification("error","Session expired!","Please restart the forgot password process.");

                    setTimeout(() => {
                        window.location.href = "Login.html";
                    },2000);

                    return;
                }

                if (response.status === 403) {

                    showNotification("error","Access denied!","You do not have permission to access this resource");
                    setTimeout(() => {
                        window.location.href = "Login.html";
                    },2000);
                    return;
                }


                const data = await response.json();

                if (response.ok) {

                    allAddress = data;

                    UserAddress.innerHTML = "";

                    if (data.length === 0) {

                        UserAddress.innerHTML = `
                            <div class="col-12">

                                <div class="no-address-card text-center border-0">

                                    <h3>NO ADDRESS ADDED</h3>

                                    <p class="mt-3 mb-4">
                                        Add a delivery address to continue your order.
                                    </p>

                                    <button class="btn add-address-button" onclick="addAddress()">Add New Address</button>

                                </div>

                            </div>
                        `;

                        return;
                    }


                    data.forEach(address => {

                        UserAddress.innerHTML += `

                            <div class="col-12 col-md-6 col-lg-4 mt-4">

                                <div class="card address-card h-100 ${address.isDefault ? "border-success" : "" }" id="address-${address.id}" onclick="selectAddressDefault(${address.id})">

                                    <div class="card-body">

                                        <p><strong>Name</strong> ${address.fullName}</p>

                                        <p><strong>Phone</strong> ${address.phoneNumber}</p>

                                        <p><strong>Street</strong> ${address.street}</p>

                                        <p><strong>Area</strong> ${address.area}</p>

                                        <p><strong>City</strong> ${address.city}</p>

                                        <p><strong>State</strong> ${address.state}</p>

                                        <p><strong>Pincode</strong> ${address.pincode}</p>

                                        <p><strong>Country</strong> ${address.country}</p>

                                        <p><strong>Type</strong> ${address.addressType}</p>

                                        <p class="mb-0"><strong>Default</strong> ${address.isDefault ? "Yes" : "No"}</p>

                                    </div>

                                    <div class="card-footer">
                                        <button type="button" onclick="event.stopPropagation(); addAddress()">Add New</button>
                                        <button type="button" onclick="event.stopPropagation(); updateAddress(${address.id})">Update</button>
                                    </div>

                                </div>

                            </div>
                        `;
                    });


                    UserAddress.innerHTML += `
                        <div class="mt-4 mb-4 text-center">
                            <button class="btn checkout-button" onclick="window.location.href='USER_Checkout_Summery.html'">Continue to Checkout</button>
                        </div>
                    `;

                } else {

                    showNotification("error","Error!","Unable to view Address.");
                }

            } catch (error) {

                console.log(error);

                showNotification("error","Server error!","Please try again later.");
            }
        }


        // =========================
        // 4 Update Address
        // =========================

        function updateAddress(addressid) {

            const address = allAddress.find(listAddress =>
                listAddress.id == addressid
            );

            document.getElementById("Updateid").value = address.id;
            document.getElementById("UpdatefullName").value = address.fullName;
            document.getElementById("UpdatephoneNumber").value = address.phoneNumber;
            document.getElementById("Updatestreet").value = address.street;
            document.getElementById("Updatearea").value = address.area;
            document.getElementById("Updatecity").value = address.city;
            document.getElementById("Updatestate").value = address.state;
            document.getElementById("Updatepincode").value = address.pincode;
            document.getElementById("Updatecountry").value = address.country;
            document.getElementById("UpdateaddressType").value = address.addressType;

            const modal = new bootstrap.Modal(document.getElementById("updateAddressModal"));

            modal.show();
        }


        // - - - - - - - - - - Update Address Section

        const UpdateForm = document.getElementById("UpdateForm");

        const Updateid = document.getElementById("Updateid");
        const UpdatefullName = document.getElementById("UpdatefullName");
        const UpdatephoneNumber = document.getElementById("UpdatephoneNumber");
        const Updatestreet = document.getElementById("Updatestreet");
        const Updatearea = document.getElementById("Updatearea");
        const Updatecity = document.getElementById("Updatecity");
        const Updatestate = document.getElementById("Updatestate");
        const Updatepincode = document.getElementById("Updatepincode");
        const Updatecountry = document.getElementById("Updatecountry");
        const UpdateaddressType = document.getElementById("UpdateaddressType");

        const submitUpdateBtn = document.getElementById("submitUpdateBtn");
        const textUpdatebtn = document.getElementById("textUpdatebtn");


        function showUpdateError(input,message) {

            input.classList.remove("is-valid");
            input.classList.add("is-invalid");
            input.nextElementSibling.innerText = message;
        }
