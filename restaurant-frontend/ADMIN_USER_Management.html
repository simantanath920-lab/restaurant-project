<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>NH15 | Admin & User Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>

        /* =========================
           NH15 MAIN THEME
        ========================= */

        body {
            background-color: #f9ead9;
            color: #272d21;
            font-weight: 300;
            font-family: "Montserrat", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* =========================
           PAGE MAIN
        ========================= */

        .category-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .category-main > div {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 3px;
            color: #272d21;
            text-align: center;
            margin-bottom: 25px;
        }


        /* =========================
           MAIN CARD
        ========================= */

        .settings-card {
            width: min(94%, 700px);
            background-color: #fffaf3;
            border: 1px solid rgba(39, 45, 33, 0.25);
            box-shadow: 0 8px 20px rgba(39, 45, 33, 0.15);
            overflow: hidden;
        }


        /* =========================
           CARD HEADER
        ========================= */

        .settings-header {
            background-color: #272d21;
            color: #f9ead9;
            text-align: center;
            padding: 20px;
        }

        .settings-header h3 {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 3px;
            margin: 0;
        }

        .settings-header p {
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #62794e;
            margin: 7px 0 0;
            font-weight: 300;
        }


        /* =========================
           CARD BODY
        ========================= */

        .settings-card .card-body {
            padding: 35px;
        }


        /* =========================
           FORM LABELS
        ========================= */

        .form-label {
            color: #68705f;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }


        /* =========================
           FORM CONTROLS
        ========================= */

        .form-control,
        .form-select {
            background-color: #fffaf3;
            color: #272d21;
            border: 1px solid rgba(39, 45, 33, 0.25);
            border-radius: 2px;
            font-family: "Montserrat", sans-serif;
            font-size: 12px;
            font-weight: 300;
            padding: 11px 13px;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #999d92;
            font-weight: 300;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #fffaf3;
            color: #272d21;
            border-color: #62794e;
            box-shadow: 0 0 0 0.15rem rgba(98, 121, 78, 0.12);
        }

        .form-control.is-invalid,
        .form-select.is-invalid {
            border-color: rgb(220, 116, 116);
        }

        .form-control.is-valid,
        .form-select.is-valid {
            border-color: #62794e;
        }

        .invalid-feedback {
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.4px;
        }


        /* =========================
           CONFIRM BUTTON
        ========================= */

        #submitBtn {
            background-color: #272d21;
            color: rgb(149, 171, 118);
            border: 1px solid #62794e;
            border-radius: 3px;
            font-family: "Montserrat", sans-serif;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1.5px;
            padding: 11px 20px;
            transition: 0.25s ease;
        }

        #submitBtn:hover {
            background-color: #62794e;
            color: #f9ead9;
            border-color: #62794e;
        }

        #submitBtn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }


        /* =========================
           FOOTER
        ========================= */

        /* Footer Section */
        .footer-Section-last{
            background-color: #272d21; 
            color: #a7bd94;
            font-weight: 500;
        }

        .icons a{
            display: inline-flex;
            border: 1px solid #dfe6d8;
            width: 50px;
            height: 50px;
            border-radius: 50px;
            align-items: center;
            justify-content: center;
        }

        .icons i{
            font-size: 22px;
            color: #a7bd94;
        }


        /* =========================
           Notification Pop up
           DO NOT CHANGE
        ========================= */

        #notificationModal {
            z-index: 2000;
        }

        .notification-icon {
            font-size: 55px;
        }

        .notification-success {
            color: rgb(149,171,118);
        }

        .notification-error {
            color: rgb(220, 116, 116);
        }

        .custom-modal {
            background-color: antiquewhite;
            border-radius: 30px;
            overflow: hidden;
        }

        .custom-header {
            background-color: black;
            color: rgb(149,171,118);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .category-main {
                padding: 30px 15px;
            }

            .page-title {
                font-size: 25px;
                letter-spacing: 2px;
                margin-bottom: 20px;
            }

            .settings-card {
                width: 96%;
            }

            .settings-card .card-body {
                padding: 25px 20px;
            }

            .settings-header {
                padding: 18px 15px;
            }

            .settings-header h3 {
                font-size: 16px;
                letter-spacing: 2px;
            }

            #submitBtn {
                width: 75% !important;
            }
        }

    </style>
</head>

<body>

    <!--Notification Pop Up -->
    <div class="modal fade" id="notificationModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center custom-modal">

                <div class="modal-header border-0 custom-header">
                    <h5 class="mb-0">NH15 Restaurant</h5>
                    <button class="btn btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div id="notificationIconContainer" class="notification-icon">
                        <i id="notificationIconElement"></i>
                    </div>

                    <h3 id="notificationTitle"></h3>

                    <p id="notificationMessage"></p>

                    <button class="btn btn-dark" style="border-radius: 20px; width: 150px; color: rgb(149,171,118);" type="button" data-bs-dismiss="modal">ok</button>

                </div>

            </div>
        </div>
    </div>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="category-main">

        <div>

            <h1 class="page-title" style="letter-spacing: 0.7rem;">ADMIN &amp; USER MANAGEMENT</h1>

            <div class="settings-card">

                <div class="settings-header">

                    <h3>ADMIN &amp; USER MANAGEMENT</h3>

                    <p>CHANGE USER ROLE</p>

                </div>

                <div class="card-body">

                    <form id="AdminUserManageForm" novalidate>

                        <!-- Email -->

                        <div class="mb-4">

                            <label for="email" class="form-label">Email</label>

                            <input type="email" name="email" id="email" class="form-control" placeholder="Enter the user/admin email address to change their role between Admin and User">

                            <div class="invalid-feedback"></div>

                        </div>


                        <!-- Change Role -->

                        <div class="mb-4">

                            <label for="adminChange" class="form-label">Change Role</label>

                            <select name="adminChange" id="adminChange" class="form-select">

                                <option value="">Select role</option>

                                <option value="ADMIN">ADMIN</option>

                                <option value="USER">USER</option>

                            </select>

                            <div class="invalid-feedback"></div>

                        </div>


                        <!-- Confirm -->

                        <div class="text-center mt-4">

                            <button id="submitBtn" type="submit" class="btn w-50"><span id="textBtn">Confirm</span></button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <!-- Footer Section -->
    <section class="footer-Section-last text-center py-5">

        <div class="container">

            <div class="d-flex flex-column flex-lg-row justify-content-center align-items-center gap-5 gap-lg-5">

                <!-- Address -->
                <div>
                    <h6>Address</h6>
                    <p class="mb-1">Madurdaha Kolkata</p>
                    <p class="mb-0">West bengal 700107</p>
                </div>

                <!-- Contact -->
                <div>
                    <h6>Contact</h6>
                    <p class="mb-1">Phone: +91 863-8148837</p>
                    <p class="mb-0">Email: nh15restaurantonline@gmail.com</p>
                </div>

                <!-- Opening Hours -->
                <div>
                    <h6>Opening Hours</h6>
                    <p class="mb-1">Mon-Sat: 11AM - 10PM</p>
                    <p class="mb-0">Sunday: Closed</p>
                </div>

                <div class="icons">

                    <h6>Follow Us</h6>

                    <a href="#" class="text-dark me-3"><i class="bi bi-instagram"></i></a>
                    <a href="#" class="text-dark me-3"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="text-dark me-3"><i class="bi bi-linkedin"></i></a>
                    <a href="#" class="text-dark me-3"><i class="bi bi-twitter-x"></i></a>

                </div>

            </div>

            <hr>

            <h6 class="fw-light mb-0">&copy; NH15 Restaurant</h6>

        </div>

    </section>


    <script>

        // =====================
        // [    Access Check   ]
        // =====================

        function checkUserAccess() {

            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");

            if (!token || role !== "ADMIN") {

                showNotification(
                    "error",
                    "Access denied!",
                    "Please login to access this page."
                );

                setTimeout(() => {
                    window.location.href = "Login.html";
                },2000);

                return false;
            }

            return true;
        }


        // =========================
        // Notification
        // SAME AS ORIGINAL
        // =========================

        const notificationModal = document.getElementById("notificationModal");

        function showNotification(type,title,message) {

            const notificationIconContainer = document.getElementById("notificationIconContainer");

            const notificationIconElement = document.getElementById("notificationIconElement");

            const notificationTitle = document.getElementById("notificationTitle");

            const notificationMessage = document.getElementById("notificationMessage");

            notificationIconContainer.classList = "notification-icon";

            if (type === "success") {

                notificationIconContainer.classList.add("notification-success");

                notificationIconElement.className = "bi bi-check-circle-fill";

            } else if (type === "error") {

                notificationIconContainer.classList.add("notification-error");

                notificationIconElement.className = "bi bi-x-circle-fill";
            }

            notificationTitle.textContent = title;

            notificationMessage.textContent = message;

            const modal = new bootstrap.Modal(notificationModal);

            modal.show();
        }


        // =========================
        // FORM ELEMENTS
        // =========================

        const AdminUserManageForm = document.getElementById("AdminUserManageForm");

        const email = document.getElementById("email");

        const adminChange = document.getElementById("adminChange");

        const submitBtn = document.getElementById("submitBtn");

        const textBtn = document.getElementById("textBtn");

        const userId = localStorage.getItem("userId");


        // =========================
        // VALIDATION
        // =========================

        function showError(input,message) {

            input.classList.add("is-invalid");

            input.classList.remove("is-valid");

            input.nextElementSibling.innerText = message;
        }


        function showSuccess(input) {

            input.classList.remove("is-invalid");

            input.classList.add("is-valid");

            input.nextElementSibling.innerText = "";
        }


        function validatesInputss() {

            let valid = true;

            // Email

            if (email.value.trim() === "") {

                showError(
                    email,
                    "Enter Email"
                );

                valid = false;

            } else {

                showSuccess(email);
            }


            // Admin Change

            if (adminChange.value.trim() === "") {

                showError(
                    adminChange,
                    "Choose Role"
                );

                valid = false;

            } else {

                showSuccess(adminChange);
            }

            return valid;
        }


        // =========================
        // LIVE VALIDATION
        // =========================

        AdminUserManageForm.addEventListener(
            "input",
            function() {

                validatesInputss();

            }
        );


        // =========================
        // FORM SUBMIT
        // =========================

        AdminUserManageForm.addEventListener(
            "submit",
            async function(e) {

                e.preventDefault();

                if (!validatesInputss()) {
                    return;
                }

                const manageDetails = {

                    email : email.value.trim(),

                    role : adminChange.value

                };

                try {

                    const token = localStorage.getItem("token");

                    submitBtn.disabled = true;

                    textBtn.innerText = "Confirming";

                    const manageResponse = await fetch(
                        "https://restaurant-project-production-38d4.up.railway.app/restaurant/admin/getDetailsOfsetting/AdminAndUser/management",
                        {

                            method : "PUT",

                            headers : {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token
                            },

                            body :
                                JSON.stringify(manageDetails)
                        }
                    );


                    // =====================
                    // [  AUT - 401 & 403  ]
                    // =====================

                    if (manageResponse.status === 401) {

                        localStorage.removeItem("token");

                        showNotification(
                            "error",
                            "Session expired!",
                            "Please restart the forgot password process."
                        );

                        setTimeout(() => {

                            window.location.href =
                                "Login.html";

                        },2000);

                        return;
                    }


                    if (manageResponse.status === 403) {

                        showNotification(
                            "error",
                            "Access denied!",
                            "You do not have permission to access this resource"
                        );
                        setTimeout(() => {
                            window.location.href = "Login.html";
                        },2000);
                        return;
                    }


                    const manageData = await manageResponse.json();

                    if (manageResponse.ok) {

                        showNotification(
                            "success",
                            "Success",
                            manageData.message
                        );

                        AdminUserManageForm.reset();

                        [
                            email,
                            adminChange
                        ]
                        .forEach(input => {

                            input.classList.remove(
                                "is-invalid",
                                "is-valid"
                            );

                            input.nextElementSibling.innerText =
                                "";

                        });

                    } else {

                        if (manageData.email) {

                            showError(
                                email,
                                manageData.email
                            );
                        }

                        if (manageData.role) {

                            showError(
                                adminChange,
                                manageData.role
                            );
                        }

                        if (manageData.message) {

                            showNotification(
                                "error",
                                "Error!",
                                manageData.message
                            );
                        }

                    }

                } catch (error) {

                    console.log(error);

                    showNotification(
                        "error",
                        "Server error!",
                        "Please try again later."
                    );

                } finally {

                    submitBtn.disabled = false;

                    textBtn.innerText = "Confirm";
                }

            }
        );


        // =========================
        // DOM CONTENT LOADED
        // =========================

        window.addEventListener(
            "DOMContentLoaded",
            function() {

                if (!checkUserAccess()) {
                    return;
                }

            }
        );

    </script>

</body>
</html>
