<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>NH15 | Admin Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        /* =========================
           NH15 MAIN THEME
        ========================= */

        body {
            background-color: #f9ead9;
            color: #272d21;
            font-weight: 300;
            font-family: "Montserrat", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .profile-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .profile-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 3px;
            color: #272d21;
            text-align: center;
            margin-bottom: 25px;
        }

        /* =========================
           PROFILE CARD
        ========================= */
 
        .profile-card {
            width: min(94%, 700px);
            background-color: #fffaf3;
            border: 1px solid rgba(39, 45, 33, 0.25);
            box-shadow: 0 8px 20px rgba(39, 45, 33, 0.15);
            overflow: hidden;
        }

        /* =========================
           CARD HEADER
        ========================= */

        .profile-header {
            background-color: #272d21;
            color: #f9ead9;
            text-align: center;
            padding: 20px;
        }

        .profile-header h3 {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 3px;
            margin: 0;
        }
 
        .profile-header p {
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #62794e;
            margin: 7px 0 0;
        }

        /* =========================
           PROFILE BODY
        ========================= */

        .profile-body {
            padding: 35px;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            gap: 25px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(39, 45, 33, 0.13);
        }

        .profile-row:last-child {
            border-bottom: none;
        }

        .profile-label {
            color: #68705f;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1px;
            min-width: 180px;
        }

        .profile-value {
            color: #272d21;
            font-size: 12px;
            font-weight: 300;
            text-align: right;
            word-break: break-word;
        }

        /* =========================
           PROFILE BUTTONS
        ========================= */

        .profile-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 0 35px 35px;
        }

        .profile-btn {
            flex: 1;
            max-width: 250px;
            background-color: #272d21;
            color: rgb(149,171,118);
            border: 1px solid #62794e;
            border-radius: 3px;
            font-family: "Montserrat", sans-serif;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 1px;
            padding: 11px 15px;
            transition: 0.25s ease;
        }

        .profile-btn:hover {
            background-color: #62794e;
            color: #f9ead9;
            border-color: #62794e;
        }

        /* =========================
           MODALS
        ========================= */

        .nh15-modal {
            background-color: #fffaf3;
            border: 1px solid rgba(39,45,33,.25);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(39,45,33,.20);
        }

        .nh15-modal .modal-header {
            background-color: #272d21;
            color: #f9ead9;
            border: 0;
            padding: 18px 20px;
        }

        .nh15-modal .modal-title {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .nh15-modal .modal-body {
            background-color: #fffaf3;
            padding: 30px;
        }

        .nh15-modal .modal-footer {
            background-color: #fffaf3;
            border-top: 1px solid rgba(39,45,33,.15);
            padding: 18px;
        }

        /* =========================
           FORM
        ========================= */

        .form-label {
            color: #68705f;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-control {
            background-color: #fffaf3;
            color: #272d21;
            border: 1px solid rgba(39,45,33,.25);
            border-radius: 2px;
            font-family: "Montserrat", sans-serif;
            font-size: 12px;
            font-weight: 300;
            padding: 11px 13px;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #999d92;
            font-weight: 300;
        }

        .form-control:focus {
            background-color: #fffaf3;
            color: #272d21;
            border-color: #62794e;
            box-shadow: 0 0 0 .15rem rgba(98,121,78,.12);
        }

        .form-control.is-invalid {
            border-color: rgb(220,116,116);
        }

        .form-control.is-valid {
            border-color: #62794e;
        }

        .invalid-feedback {
            font-size: 10px;
            font-weight: 300;
            letter-spacing: .4px;
        }

        /* =========================
           MODAL SUBMIT BUTTON
        ========================= */

        .modal-submit {
            background-color: #272d21;
            color: rgb(149,171,118);
            border: 1px solid #62794e;
            border-radius: 3px;
            font-family: "Montserrat", sans-serif;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 1px;
            padding: 10px 15px;
            transition: .25s ease;
        }

        .modal-submit:hover {
            background-color: #62794e;
            color: #f9ead9;
        }

        /* =========================
           FOOTER
        ========================= */

        /* Footer Section */

        .footer-Section-last{
            background-color: #272d21; 
            color: #a7bd94;
            font-weight: 500;
        }

        .icons a{
            display: inline-flex;
            border: 1px solid #dfe6d8;
            width: 50px;
            height: 50px;
            border-radius: 50px;
            align-items: center;
            justify-content: center;
        }

        .icons i{
            font-size: 22px;
            color: #a7bd94;
        }

        /* =========================
           Notification Pop up
           SAME AS ORIGINAL
        ========================= */

        #notificationModal {
            z-index: 2000;
        }

        .notification-icon {
            font-size: 55px;
        }

        .notification-success {
            color: rgb(149,171,118);
        }

        .notification-error {
            color: rgb(220, 116, 116);
        }

        .custom-modal {
            background-color: antiquewhite;
            border-radius: 30px;
            overflow: hidden;
        }

        .custom-header {
            background-color: black;
            color: rgb(149,171,118);
        }

        /* =========================
           MOBILE
        ========================= */

            @media (max-width: 768px) {

                .profile-main {
                    padding: 35px 10px;
                }

                .page-title {
                    font-size: 25px;
                    letter-spacing: 2px;
                    margin-bottom: 25px;
                }

                .profile-card {
                    width: 100%;
                }

                .profile-header {
                    padding: 17px 12px;
                }

            }
    </style>
</head>

<body>

    <!--Notification Pop Up -->

    <div class="modal fade" id="notificationModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center custom-modal">

                <div class="modal-header border-0 custom-header">
                    <h5 class="mb-0">NH15 Restaurant</h5>
                    <button class="btn btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div id="notificationIconContainer" class="notification-icon">
                        <i id="notificationIconElement"></i>
                    </div>

                    <h3 id="notificationTitle"></h3>
                    <p id="notificationMessage"></p>

                    <button class="btn btn-dark" style="border-radius: 20px; width: 150px; color: rgb(149,171,118);" type="button" data-bs-dismiss="modal">ok</button>
                </div>

            </div>
        </div>
    </div>

    <!-- =========================
         Update Admin Profile Modal
    ========================= -->

    <div class="modal fade" id="updateAdminProfile">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content nh15-modal">

                <div class="modal-header">
                    <h4 class="modal-title">UPDATE ADMIN PROFILE</h4>
                    <button class="btn btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>

                <form id="updateAdminForm" novalidate>

                    <div class="modal-body">

                        <div class="mb-4">
                            <label for="name" class="form-label">Admin Name</label>
                            <input type="text" name="name" id="name" class="form-control" placeholder="Enter Admin Name">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-4">
                            <label for="phonenumber" class="form-label">Admin Phone No</label>
                            <input type="text" name="phonenumber" id="phonenumber" class="form-control" placeholder="Enter Admin Phone No">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-4">
                            <label for="address" class="form-label">Admin Address</label>
                            <input type="text" name="address" id="address" class="form-control" placeholder="Enter Admin Address">
                            <div class="invalid-feedback"></div>
                        </div>

                    </div>

                    <div class="modal-footer justify-content-center">
                        <button class="modal-submit w-50" type="submit" id="submitBtnn"><span id="textBtnn">Update profile</span></button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <!-- =========================
         Change Password Modal
    ========================= -->

    <div class="modal fade" id="changePasswordModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content nh15-modal">

                <div class="modal-header">
                    <h4 class="modal-title">Change Password</h4>
                    <button class="btn btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>

                <form id="passwordChangeForm" novalidate>

                    <div class="modal-body">

                        <div class="mb-4">
                            <label for="currentpassword" class="form-label">Current Password</label>
                            <input type="password" name="currentpassword" id="currentpassword" class="form-control" placeholder="Enter current password">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-4">
                            <label for="newpassword" class="form-label">New Password</label>
                            <input type="password" name="newpassword" id="newpassword" class="form-control" placeholder="Enter new password">
                            <div class="invalid-feedback"></div>
                        </div>

                    </div>

                    <div class="modal-footer justify-content-center">
                        <button class="modal-submit w-50" type="submit" id="submitBtn"><span id="textBtn">Confirm Password</span></button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="profile-main">

        <div class="profile-container">

            <h1 class="page-title" style="letter-spacing: 0.7rem;">ADMIN PROFILE</h1>

            <div id="ViewAdminDetails"></div>

        </div>

    </main>

    <!-- =========================
         FOOTER
    ========================= -->

    <!-- Footer Section -->

    <section class="footer-Section-last text-center py-5">

        <div class="container">

            <div class="d-flex flex-column flex-lg-row justify-content-center align-items-center gap-5 gap-lg-5">

                <!-- Address -->

                <div>
                    <h6>Address</h6>
                    <p class="mb-1">Madurdaha Kolkata</p>
                    <p class="mb-0">West bengal 700107</p>
                </div>

                <!-- Contact -->

                <div>
                    <h6>Contact</h6>
                    <p class="mb-1">Phone: +91 863-8148837</p>
                    <p class="mb-0">Email: nh15restaurantonline@gmail.com</p>
                </div>

                <!-- Opening Hours -->

                <div>
                    <h6>Opening Hours</h6>
                    <p class="mb-1">Mon-Sat: 11AM - 10PM</p>
                    <p class="mb-0">Sunday: Closed</p>
                </div>

                <div class="icons">
                    <h6>Follow Us</h6>
                    <a href="#" class="text-dark me-3"><i class="bi bi-instagram"></i></a>
                    <a href="#" class="text-dark me-3"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="text-dark me-3"><i class="bi bi-linkedin"></i></a>
                    <a href="#" class="text-dark me-3"><i class="bi bi-twitter-x"></i></a>
                </div>

            </div>

            <hr>

            <h6 class="fw-light mb-0">&copy; NH15 Restaurant</h6>

        </div>

    </section>

    <script>
        // =====================
        // [    Access Check   ]
        // =====================

        function checkUserAccess() {
            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");

            if(!token || role !== "ADMIN") {
                showNotification("error", "Access denied!", "Please login to access this page.");

                setTimeout(() => {
                    window.location.href = "Login.html";
                },2000);

                return false;
            }

            return true;
        }

        // =========================
        // NOTIFICATION
        // SAME AS ORIGINAL
        // =========================

        const notificationModal = document.getElementById("notificationModal");

        function showNotification(type,title,message) {
            const notificationIconContainer = document.getElementById("notificationIconContainer");
            const notificationIconElement = document.getElementById("notificationIconElement");
            const notificationTitle = document.getElementById("notificationTitle");
            const notificationMessage = document.getElementById("notificationMessage");

            notificationIconContainer.classList = "notification-icon";

            if(type === "success") {
                notificationIconContainer.classList.add("notification-success");
                notificationIconElement.className = "bi bi-check-circle-fill";
            }else if(type === "error") {
                notificationIconContainer.classList.add("notification-error");
                notificationIconElement.className = "bi bi-x-circle-fill";
            }

            notificationTitle.textContent = title;
            notificationMessage.textContent = message;

            const modal = new bootstrap.Modal(notificationModal);
            modal.show();
        }

        const userId = localStorage.getItem("userId");
        const ViewAdminDetails = document.getElementById("ViewAdminDetails");

        // =========================
        // VIEW ADMIN DETAILS
        // =========================

        async function ViewADMINdetails() {
            try {
                const token = localStorage.getItem("token");

                const viewAdminResponse = await fetch(`https://restaurant-project-production-38d4.up.railway.app/restaurant/admin/AdminProfile/viewAdminDetails/${userId}`, {
                    method : "GET",
                    headers : {
                        "Authorization":
                            "Bearer " + token
                    }
                });

                // =====================
                // [  AUT - 401 & 403  ]
                // =====================

                if(viewAdminResponse.status === 401) {
                    localStorage.removeItem("token");

                    showNotification("error","Session expired!","Please restart the forgot password process.");

                    setTimeout(() => {
                        window.location.href = "Login.html";
                    },2000);

                    return;
                }

                if(viewAdminResponse.status === 403) {
                    showNotification("error","Access denied!","You do not have permission to access this resource");
                    setTimeout(() => {
                        window.location.href = "Login.html";
                    },2000);
                    return;
                }

                const viewAdminData = await viewAdminResponse.json();

                if(viewAdminResponse.ok) {
                    ViewAdminDetails.innerHTML = `
                        <div class="profile-card">

                            <div class="profile-header">
                                <h3>ADMIN PROFILE</h3>
                                <p>ACCOUNT INFORMATION</p>
                            </div>

                            <div class="profile-body">

                                <div class="profile-row">
                                    <span class="profile-label">ADMIN NAME</span>
                                    <span class="profile-value">${viewAdminData.name}</span>
                                </div>

                                <div class="profile-row">
                                    <span class="profile-label">ADMIN EMAIL</span>
                                    <span class="profile-value">${viewAdminData.email}</span>
                                </div>

                                <div class="profile-row">
                                    <span class="profile-label">ADMIN PHONE NO</span>
                                    <span class="profile-value">${viewAdminData.phonenumber}</span>
                                </div>

                                <div class="profile-row">
                                    <span class="profile-label">ADMIN ADDRESS</span>
                                    <span class="profile-value">${viewAdminData.address}</span>
                                </div>

                                <div class="profile-row">
                                    <span class="profile-label">ADMIN ROLE</span>
                                    <span class="profile-value">${viewAdminData.role}</span>
                                </div>

                                <div class="profile-row">
                                    <span class="profile-label">ADMIN PASSWORD</span>
                                    <span class="profile-value">· · · · · · · ·</span>
                                </div>

                            </div>

                            <div class="profile-actions">

                                <button class="profile-btn" onclick="changePasswordFunction()">Change Password</button>
                                <button class="profile-btn" onclick="updateAdminProfileFunction()">Update Profile</button>

                            </div>

                        </div>
                    `;
                }else {
                    showNotification(
                        "error",
                        "Error!",
                        "Unable to fetch Admin Profile Details."
                    );
                }

            } catch(error) {
                console.log(error);

                showNotification(
                    "error",
                    "Server error!",
                    "Please try again later."
                );
            }
        }

        // =========================
        // UPDATE ADMIN PROFILE
        // =========================

        function updateAdminProfileFunction() {
            const updateAdminProfile = document.getElementById("updateAdminProfile");
            const modal = new bootstrap.Modal(updateAdminProfile);

            modal.show();
        }

        const name = document.getElementById("name");
        const phonenumber = document.getElementById("phonenumber");
        const address = document.getElementById("address");
        const submitBtnn = document.getElementById("submitBtnn");
        const textBtnn = document.getElementById("textBtnn");
        const updateAdminForm = document.getElementById("updateAdminForm");

        function showErrorrr(input,message) {
            input.classList.remove("is-valid");
            input.classList.add("is-invalid");
            input.nextElementSibling.innerText = message;
        }

        function showSuccessss(input) {
            input.classList.remove("is-invalid");
            input.classList.add("is-valid");
            input.nextElementSibling.innerText = "";
        }

        function validatesInputssss() {
            let valid = true;

            if(name.value.trim() === "") {
                showError(
                    name,
                    "Enter Admin Name"
                );

                valid = false;
            }else {
                showSuccess(name);
            }

            if(phonenumber.value.trim() === "") {
                showError(
                    phonenumber,
                    "Enter Admin Phone No"
                );

                valid = false;
            }else {
                showSuccess(phonenumber);
            }

            if(address.value.trim() === "") {
                showError(
                    address,
                    "Enter Admin Address"
                );

                valid = false;
            }else {
                showSuccess(address);
            }

            return valid;
        }

        updateAdminForm.addEventListener(
            "input",
            function() {
                validatesInputssss();
            }
        );

        updateAdminForm.addEventListener(
            "submit",
            async function(e) {
                e.preventDefault();

                if(!validatesInputssss()) {
                    return;
                }

                const updateAdminDetails = {
                    name :
                        name.value.trim(),

                    phonenumber :
                        phonenumber.value.trim(),

                    address :
                        address.value.trim()
                };

                try {
                    const token = localStorage.getItem("token");

                    submitBtnn.disabled = true;
                    textBtnn.innerText = "Updating profile...";

                    const updateAdminResponse = await fetch(`https://restaurant-project-production-38d4.up.railway.app/restaurant/admin/AdminProfile/updateAdminProfile/${userId}`, {
                        method : "PUT",
                        headers : {
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " + token
                        },

                        body :
                            JSON.stringify(
                                updateAdminDetails
                            )
                    });

                    // =====================
                    // [  AUT - 401 & 403  ]
                    // =====================

                    if(updateAdminResponse.status === 401) {
                        localStorage.removeItem("token");

                        showNotification(
                            "error",
                            "Session expired!",
                            "Please restart the forgot password process."
                        );

                        setTimeout(() => {
                            window.location.href = "Login.html";
                        },2000);

                        return;
                    }

                    if(updateAdminResponse.status === 403) {
                        showNotification("error","Access denied!","You do not have permission to access this resource");
                        setTimeout(() => {
                            window.location.href = "Login.html";
                        },2000);
                        return;
                    }

                    const updateAdminData = await updateAdminResponse.json();

                    if(updateAdminResponse.ok) {
                        showNotification(
                            "success",
                            "Success",
                            updateAdminData.message
                        );

                        updateAdminForm.reset();
                        ViewADMINdetails();

                        bootstrap.Modal.getInstance(
                            document.getElementById(
                                "updateAdminProfile"
                            )
                        ).hide();

                        [
                            name,
                            phonenumber,
                            address
                        ].forEach(input => {
                            input.classList.remove(
                                "is-invalid",
                                "is-valid"
                            );

                            input.nextElementSibling.innerText = "";
                        });

                    }else {
                        if(updateAdminData.name) {
                            showErrorrr(
                                name,
                                updateAdminData.name
                            );
                        }

                        if(updateAdminData.phonenumber) {
                            showErrorrr(
                                phonenumber,
                                updateAdminData.phonenumber
                            );
                        }

                        if(updateAdminData.address) {
                            showErrorrr(
                                address,
                                updateAdminData.address
                            );
                        }

                        if(updateAdminData.message) {
                            showNotification(
                                "error",
                                "Error",
                                updateAdminData.message
                            );
                        }
                    }

                } catch(error) {
                    console.log(error);

                    showNotification(
                        "error",
                        "Server error!",
                        "Please try again later."
                    );

                } finally {
                    submitBtnn.disabled = false;
                    textBtnn.innerText = "Update profile";
                }
            }
        );

        // =========================
        // CHANGE PASSWORD
        // =========================

        function changePasswordFunction() {
            const changePasswordModal = document.getElementById("changePasswordModal");
            const modal = new bootstrap.Modal(changePasswordModal);

            modal.show();
        }

        const currentpassword = document.getElementById("currentpassword");
        const newpassword = document.getElementById("newpassword");
        const submitBtn = document.getElementById("submitBtn");
        const textBtn = document.getElementById("textBtn");
        const passwordChangeForm = document.getElementById("passwordChangeForm");

        function showError(input,message) {
            input.classList.remove(
                "is-valid"
            );

            input.classList.add(
                "is-invalid"
            );

            input.nextElementSibling.innerText = message;
        }

        function showSuccess(input) {
            input.classList.remove(
                "is-invalid"
            );

            input.classList.add(
                "is-valid"
            );

            input.nextElementSibling.innerText = "";
        }

        function validatesInputsss() {
            let valid = true;

            if(currentpassword.value.trim() === "") {
                showError(
                    currentpassword,
                    "Enter current password"
                );

                valid = false;
            }else {
                showSuccess(
                    currentpassword
                );
            }

            if(newpassword.value.trim() === "") {
                showError(
                    newpassword,
                    "Enter new Password"
                );

                valid = false;
            }else {
                showSuccess(
                    newpassword
                );
            }

            return valid;
        }

        passwordChangeForm.addEventListener(
            "input",
            function() {
                validatesInputsss();
            }
        );

        passwordChangeForm.addEventListener(
            "submit",
            async function(e) {
                e.preventDefault();

                if(!validatesInputsss()) {
                    return;
                }

                const passwordChangeDetails = {
                    currentPassword :
                        currentpassword.value.trim(),

                    newPassword :
                        newpassword.value.trim()
                };

                try {
                    const token = localStorage.getItem("token");

                    submitBtn.disabled = true;
                    textBtn.innerText = "Confirming Password...";

                    const changePasswordResponse = await fetch(`https://restaurant-project-production-38d4.up.railway.app/restaurant/admin/AdminProfile/ChangeAdminPassword/${userId}`, {
                        method : "PUT",
                        headers : {
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " + token
                        },

                        body :
                            JSON.stringify(
                                passwordChangeDetails
                            )
                    });

                    // =====================
                    // [  AUT - 401 & 403  ]
                    // =====================

                    if(changePasswordResponse.status === 401) {
                        localStorage.removeItem("token");

                        showNotification(
                            "error",
                            "Session expired!",
                            "Please restart the forgot password process."
                        );

                        setTimeout(() => {
                            window.location.href = "Login.html";
                        },2000);

                        return;
                    }

                    if(changePasswordResponse.status === 403) {
                        showNotification(
                            "error",
                            "Access denied!",
                            "You do not have permission to access this resource"
                        );
                        setTimeout(() => {
                            window.location.href = "Login.html";
                        },2000);
                        return;
                    }

                    const changePasswordData = await changePasswordResponse.json();

                    if(changePasswordResponse.ok) {
                        showNotification(
                            "success",
                            "Success",
                            changePasswordData.message
                        );

                        passwordChangeForm.reset();

                        [
                            currentpassword,
                            newpassword
                        ].forEach(input => {
                            input.classList.remove(
                                "is-invalid",
                                "is-valid"
                            );

                            input.nextElementSibling.innerText = "";
                        });

                    }else {
                        if(changePasswordData.currentPassword) {
                            showError(
                                currentpassword,
                                changePasswordData.currentPassword
                            );
                        }

                        if(changePasswordData.newPassword) {
                            showError(
                                newpassword,
                                changePasswordData.newPassword
                            );
                        }

                        if(changePasswordData.message) {
                            showNotification(
                                "error",
                                "Error!",
                                changePasswordData.message
                            );
                        }
                    }

                } catch(error) {
                    console.log(error);

                    showNotification(
                        "error",
                        "Server error!",
                        "Please try again later."
                    );

                } finally {
                    submitBtn.disabled = false;
                    textBtn.innerText = "Confirm Password";
                }
            }
        );

        // =========================
        // DOM CONTENT LOADED
        // =========================

        window.addEventListener("DOMContentLoaded",function() {
            
                if(!checkUserAccess()) {
                    return;
                }

                ViewADMINdetails();
            }
        );
    </script>

</body>

</html>
