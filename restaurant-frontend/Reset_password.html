<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: "Montserrat", sans-serif;
        }

        /* Notification Pop up */
        #notificationModal{
            z-index: 2000;
        }

        .notification-icon{
            font-size: 55px;
        }

        .notification-success{
            color: rgb(149,171,118);
        }

        .notification-error{
            color: rgb(220, 116, 116);
        }

        .custom-modal{
            background-color: antiquewhite;
            border-radius: 30px;
            overflow: hidden;
        }

        .custom-header{ 
            background-color: black;
            color: rgb(149,171,118);
        }




        /* Main-Section-Parent */
          .Main-Section-Parent{
            position: relative;
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .MainLogo-Image{
            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position:right center;
            position: absolute;
            top: 0;
            left: 0;

            z-index: -1;
        }
        .Main-Section-Parent{
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }



        /* Reset password Card */
        .card{
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%,-50%);
            text-align: center;
            width: min(90%,500px);
            background-color: rgba(250, 235, 215, 0.666);
        }

        .Input-One{
            background: antiquewhite;
            transition: all 1.35s ease-in-out;
            padding: 14px 40px;
            border: 1px solid antiquewhite;
        }
        .Input-One:hover{
            background-color: rgb(149, 171, 118);
            letter-spacing: 2px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }
        .bttnn{
            border: 1px solid rgb(0, 0, 0);
            background-color: black;
            border-radius: 40px;
            padding: 10px;
            color: rgb(149, 171, 118);
            font-weight: 400;
        }
        
        .bttnn:hover{
            border: 1px solid rgb(0, 0, 0);
            color: rgb(0, 0, 0);
            transition: all 0.25s ease-in-out;
            background-color: rgb(149, 171, 118);
        }
        .form-control:focus{
            background-color: rgb(227, 144, 144);
        }

        .forgot-Password-btn{
             color: rgb(7, 48, 15);
        } 
        .forgot-Password-btn:hover{
             color: rgb(7, 48, 15);
        }
        .register-btn{
            color: rgb(7, 48, 15);
        }
        .register-btn:hover{
            color: rgb(7, 48, 15);
        }



        /* Footer Section */
        .footer-Section-last{
            background-color: #272d21; 
            color: #a7bd94;
            font-weight: 500;
        }

        .icons a{
            display: inline-flex;
            border: 1px solid #dfe6d8;
            width: 50px;
            height: 50px;
            border-radius: 50px;
            align-items: center;
            justify-content: center;
        }

        .icons i{
            font-size: 22px;
            color: #a7bd94;
        }
    </style>

</head>
<body>

    <!--Notification Pop Up -->
    <div class="modal fade" id="notificationModal">
        <div class="modal-dialog modal-dialog-centered" >
            <div class="modal-content text-center custom-modal">

                <div class="modal-header border-0 custom-header">
                    <h5 class="mb-0">NH15 Restaurant</h5>
                    <button class="btn btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div id="notificationIconContainer" class="notification-icon">
                        <i id="notificationIconElement"></i>
                    </div>

                    <h3 id="notificationTitle"></h3>

                    <p id="notificationMessage"></p>

                    <button class="btn btn-dark" style="border-radius: 20px; width: 150px; color: rgb(149,171,118);" type="button" data-bs-dismiss="modal">ok</button>
                </div>

            </div>
        </div>
    </div>


    <!-- Main Section -->
    <section class="Main-Section-Parent">
        <img src="67F18543-FEF8-4CA4-AFC2-BAAF29CBDE53.PNG" alt="mainlogo" class="MainLogo-Image shadow-lg">

            <div class="card shadow-lg border-0">   
                <div class="card-body">

                    <h4 class="ms-auto card-title mb-4" style="letter-spacing: 7px;">RESET PASSWORD</h4>

                    <form id="ResetPasswordForm" novalidate>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label text-start d-block" style="letter-spacing: 7px;">New Password</label>
                                <input type="password" class="form-control shadow-lg  Input-One text-center" id="newPassword" placeholder="E n t e r  n e w  p a s s w o r d">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label text-start d-block" style="letter-spacing: 7px;">Confirm Password</label>
                                <input type="password" class="form-control shadow-lg  Input-One text-center" id="confirmPassword" placeholder="C o n f i r m  p a s s w o r d">
                            <div class="invalid-feedback"></div>
                        </div>

                        <button type="submit" id="resetBtn" class="bttnn w-50 mt-4 mb-3">
                            <span id="textBtn">Reset Password</span>
                        </button>

                        <div class="back-btn-part">
                            <a href="Verify_OTP.html" class="register-btn">back</a>
                        </div>

                    </form>
                     
                </div>
            </div>
        </img>
        </section>

    
    <script> 
        const notificationModal = document.getElementById("notificationModal");
         
        function showNotification(type,title,message){

            const notificationIconContainer = document.getElementById("notificationIconContainer");
            const notificationIconElement = document.getElementById("notificationIconElement");
            const notificationTitle = document.getElementById("notificationTitle");
            const notificationMessage = document.getElementById("notificationMessage");

            notificationIconContainer.classList = "notification-icon";

            if(type === "success"){

                notificationIconContainer.classList.add("notification-success");
                notificationIconElement.className = "bi bi-check-circle-fill";

            }else if(type === "error"){

                notificationIconContainer.classList.add("notification-error");               
                notificationIconElement.className = "bi bi-x-circle-fill";

            }

            notificationTitle.textContent = title;
            notificationMessage.textContent = message;

            const modal = new bootstrap.Modal(notificationModal);
            modal.show();
        }


        // Elements
        const ResetPasswordForm = document.getElementById("ResetPasswordForm");

        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");

        const resetBtn = document.getElementById("resetBtn");
        const textBtn = document.getElementById("textBtn");

        const resetToken = localStorage.getItem("resetToken");


        // Show Error
        function showError(input,message){
            input.classList.remove("is-valid");
            input.classList.add("is-invalid");

            input.nextElementSibling.innerText = message;
        }

        // Show Success
        function showSuccess(input){
            input.classList.remove("is-invalid");
            input.classList.add("is-valid");

            input.nextElementSibling.innerText = "";
        }

        // Validation
        function validateInputs(){

            let isValid = true;

            if(newPassword.value.trim().length < 6){
                showError(newPassword,"Password must be at least 6 characters");
                isValid = false;
            }else{
                showSuccess(newPassword);
            }

            if(confirmPassword.value.trim() === "" || confirmPassword.value !== newPassword.value){
                showError(confirmPassword,"Confirm password didn't match");
                isValid = false;
            }else{
                showSuccess(confirmPassword);
            }

            return isValid;
        }


        // Real Time Validation
        ResetPasswordForm.addEventListener("input",function(){
            validateInputs();
        });


        // Submit Form
        ResetPasswordForm.addEventListener("submit",async function(e){

            e.preventDefault();

            if(!validateInputs()){
                return;
            }
 
            if(!resetToken){
                showNotification("error","Session expired!","Please restart the forgot password process.");
                window.location.href = "Forgot_Password.html";
                return;
            }

            const resetPasswordRequest = {
                resetToken : resetToken,
                newPassword : newPassword.value.trim()
            };

            try{
                resetBtn.disabled = true;
                textBtn.innerText = "Resetting...";

                const response = await fetch("https://restaurant-project-production-38d4.up.railway.app/restaurant/api/auth/reset-password",{

                        method : "POST",

                        headers : {
                            "Content-Type":"application/json"
                        },

                        body : JSON.stringify(resetPasswordRequest)
                    });
  
                const data = await response.json();

                if(response.ok){

                    localStorage.removeItem("resetEmail");
                    localStorage.removeItem("resetToken");

                    showNotification("success","Success",data.message);

                    setTimeout(() => {
                        window.location.href = "Login.html";
                    },2000);

                }else{
                    showNotification("error","Error!",data.message);
                }

            }
            catch(error){
                console.error(error);
                showNotification("error","Server error!","Please try again later.");
            }

            finally{
                resetBtn.disabled = false;
                textBtn.innerText = "Reset Password";
            }
        });
    </script>
</body>
</html>
