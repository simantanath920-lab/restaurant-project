<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: "Montserrat", sans-serif;
            background-color: antiquewhite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verification-card{
            width: min(90%, 500px);
            border-radius: 20px;
            background-color: white;
        }

        .verification-icon{
            font-size: 5rem;
            color: rgb(149,171,118);
        }

        .error-icon{
            color: #dc3545;
        }

        .title{
            font-weight: 700;
        }

        .message{
            font-weight: 500;
            color: #333;
        }

        .custom-btn{
            background-color: black;
            color: rgb(149,171,118);
            border: none;
            border-radius: 30px;
            padding: 10px 25px;
            transition: all .3s ease;
        }

        .custom-btn:hover{
            background-color: rgb(149,171,118);
            color: black;
        }
    </style>

</head>
<body>


    <div class="container">
        <div class="card shadow-lg border-0 mx-auto verification-card">
            <div class="card-body text-center p-5">
                <i id="verificationIcon" class="bi bi-hourglass-split verification-icon"></i>
                <h3 id="verificationTitle" class="title mt-4"> Verifying Your Email...</h3>
                <p id="verificationMessage" class="message mt-3">Please wait while we verify your email address.</p>

                <a href="Login.html" id="continueButton" class="btn custom-btn mt-3" style="display:none;">Continue to Login</a>

                <button type="button" id="resendVerificationLink" class="btn btn-outline-dark mt-3" style="display:none;">Resend Verification Link</button>
            </div>
        </div>
    </div>



    <script>

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");

        const verificationIcon = document.getElementById("verificationIcon");
        const verificationTitle = document.getElementById("verificationTitle");
        const verificationMessage = document.getElementById("verificationMessage");
        const continueButton = document.getElementById("continueButton");
        const resendVerificationLink = document.getElementById("resendVerificationLink");

        async function verifyEmail(){

            if(!token){

                verificationIcon.className = "bi bi-x-circle-fill verification-icon error-icon";

                verificationTitle.innerText = "Verification Failed";

                verificationMessage.innerText = "Verification token is missing.";

                continueButton.style.display = "inline-block";

                return;
            }

            try{

                const response = await fetch(`http://localhost:8080/restaurant/api/auth/verify-email?token=${encodeURIComponent(token)}`,{

                    method: "GET"
                });

                const data = await response.json();

                if(response.ok){

                    verificationIcon.className = "bi bi-check-circle-fill verification-icon";
                    verificationTitle.innerText = "Email Verified Successfully!";
                    verificationMessage.innerText = data.message;
                    continueButton.style.display = "inline-block";
                }
                else{
                    verificationIcon.className = "bi bi-x-circle-fill verification-icon error-icon";
                    verificationTitle.innerText = "Verification Failed";
                    verificationMessage.innerText = data.message || "Unable to verify your email.";
                    resendVerificationLink.style.display = "inline-block";
                }
            }

            catch(error){
                console.error("Verification Error:",error);
                verificationIcon.className = "bi bi-exclamation-circle-fill verification-icon error-icon";
                verificationTitle.innerText = "Server Error";
                verificationMessage.innerText = "Unable to connect to the server. Please try again later.";
            }
        }

        resendVerificationLink.addEventListener("click",async function(){

            const email = localStorage.getItem("verificationEmail");

            if(!email){
                 alert("Verification email not found. Please register again.");
            return;
        }

                try{
                    resendVerificationLink.disabled = true;

                    resendVerificationLink.innerText = "Sending...";

                    const response = await fetch(`http://localhost:8080/restaurant/api/auth/resend-verification-Link?email=${encodeURIComponent(email)}`,{

                         method: "POST"
                    });

                    const data = await response.json();

                    if(response.ok){

                        alert(data.message);
                    }

                    else{
                        alert(data.message || "Unable to resend verification link.");
                    }
                }

                catch(error){
                    console.error("Resend Verification Error:",error);
                    alert("Unable to connect to the server.");
                }


                finally{
                    resendVerificationLink.disabled = false;
                    resendVerificationLink.innerText ="Resend Verification Link";
                }
            }
        );

        verifyEmail();

    </script>

</body>
</html>
